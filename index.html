V.pron = ()=>{
  if(PU.id) return puDetail(PU.id);
  const done=S.pronDone||{}, nDone=Object.keys(done).length, nAll=PRON_PARTS.reduce((a,p)=>a+p[1].length,0);
  return `<h1>発音講座</h1>
  <p class="muted">発音記号の読み方、日本人が苦手な音、音のつながり、リズムを、ルール → 聞き分け → 言ってみる の順で練習します。発音はアメリカ英語が基準です。</p>
  <div class="panel row" style="justify-content:space-between"><span>終えた単元 <b class="en">${nDone}</b> / ${nAll}</span><div class="lq-bar" aria-hidden="true" style="flex:1;max-width:220px">${'<i class="on" style="flex:1"></i>'.repeat(nDone)}${'<i style="flex:1"></i>'.repeat(nAll-nDone)}</div></div>
  ${PRON_PARTS.map(([name,us])=>`<h2>${name}</h2><div class="list">${us.map(([id,title])=>{const has=!!PRON_UNITS[id];
    return `<button class="li" data-act="puopen" data-id="${id}"><span><span class="t" style="font-family:var(--jp)">${esc(title)}</span><br><span class="s">${has?esc(PRON_UNITS[id].one):'準備中'}</span></span><span>${done[id]?'<span class="st known">終えた</span>':''}${puOk(id)?'':`<span class="lockmark" aria-label="鍵">${I.lock}</span>`}</span></button>`}).join('')}</div>`).join('')}`;
};
function puDetail(id){
  const title=PRON_PARTS.flatMap(p=>p[1]).find(u=>u[0]===id)[1], u=PRON_UNITS[id];
  const back=`<button class="btn sm back" data-act="puclose" style="display:inline-flex">← 単元の一覧に戻る</button>`;
  if(!puOk(id)) return `${back}<h1>${esc(title)}</h1>${upsell('発音講座のこの単元は、無料カウンセリング（面談）を受けると使えます。')}`;
  if(!u) return `${back}<h1>${esc(title)}</h1><div class="panel empty muted">この単元は準備中です。順番に追加していきます。</div>`;
  const q=u.pairs[PU.i], quizDone=PU.i>=u.pairs.length;
  return `${back}<h1>${esc(title)}</h1>
  <div class="panel"><p class="filter-l" style="margin:0">ひとことで言うと</p><p style="font-size:18px;margin:2px 0 0;font-weight:700;color:var(--teal-ink)">${esc(u.one)}</p></div>
  <h2>発音記号と口の形</h2>
  <div class="stack">${u.sym.map(s=>`<div class="panel"><div class="row"><span class="word ipa-big">${esc(s.s)}</span></div><p style="margin:6px 0">${esc(s.how)}</p>
    <div class="row">${s.ex.map(w=>`<button class="btn sm" data-act="say" data-t="${esc(w)}">${I.speaker} <span class="en">${esc(w)}</span></button>`).join('')}</div></div>`).join('')}</div>
  <h2>ルール</h2><div class="panel"><p style="margin:0">${esc(u.rule)}</p></div>
  ${u.pairs.length?`<h2>聞き分け</h2><div class="panel">
    ${quizDone?`<p style="margin:0"><b>${PU.score} / ${u.pairs.length}問</b> 聞き分けられました。</p><button class="btn sm" style="margin-top:8px" data-act="puretry">もう一度</button>`
    :`<p class="muted small" style="margin:0">${PU.i+1} / ${u.pairs.length}　音声を聞いて、聞こえた方を選んでください</p>
      <button class="btn primary" style="margin:10px 0" data-act="puplay">${I.speaker} 音声を聞く</button>
      <div class="row">${q.map((w,k)=>`<button class="opt en ${PU.pick!=null?(k===PU.t?'right':(k===PU.pick?'wrong':'')):''}" style="flex:1;min-width:120px" data-act="pupick" data-k="${k}" ${PU.pick!=null?'disabled':''}>${esc(w)}</button>`).join('')}</div>
      ${PU.pick!=null?`<p class="small" style="margin:8px 0 0">${PU.pick===PU.t?'正解！':'おしい。'}流れたのは <b class="en">${esc(q[PU.t])}</b> です。<button class="btn sm" data-act="say" data-t="${esc(q[0])}">${esc(q[0])}</button> <button class="btn sm" data-act="say" data-t="${esc(q[1])}">${esc(q[1])}</button></p>
      <button class="btn primary" style="margin-top:8px" data-act="punext">${PU.i+1<u.pairs.length?'次へ':'結果を見る'}</button>`:''}`}
  </div>`:''}
  <h2>言ってみる</h2>
  <div class="stack">${u.practice.map(s=>`<div class="panel"><div class="row"><span class="en" style="font-size:18px">${esc(s)}</span>${sayBtn(s)}</div>
    ${feature('pron')?`<button class="btn sm" style="margin-top:8px" data-act="pron" data-id="pp:${esc(s)}">${I.mic} 録音して比べる</button>${PRON.id==='pp:'+s?pronPanel(s):''}`:`<p class="muted small" style="margin:6px 0 0">お手本を聞いて、まねして言ってみましょう。録音して比べる機能は、面談を受けると使えます。</p>`}</div>`).join('')}</div>
  <div class="row" style="margin-top:16px"><button class="btn ${S.pronDone&&S.pronDone[id]?'on':'primary'}" data-act="pudone" data-id="${id}">${S.pronDone&&S.pronDone[id]?'この単元を終えた ✓':'この単元を終えた'}</button>${back}</div>`;
}

${DEBUG?`    <p class="muted small">確認用: 区分を切り替えて、見え方を確かめられます（URLに ?debug を付けたときだけ表示）。</p>

    ${producedBy()}</div>

  <p class="muted small" style="margin-top:10px">今後、ここにアカウントの削除、プライバシーポリシー、利用規約を置きます。</p>`;

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const d = b.dataset;
  switch(d.act){
    case 'go': if(d.v==='level' && R.v!=='level' && LQS.done) LQS={cat:null,i:0,score:0,pick:null,qs:[],done:false}; if(d.v==='pron') PU={id:null,i:0,t:0,pick:null,score:0}; if(d.v==='learn'){ go('learn',{cat:null,sel:null}); break; } go(d.v); break;
    case 'login': { const n=$('#w-name').value.trim(); if(!n){ $('#w-name').focus(); return; } S.user=n;
      const code=$('#w-code').value.trim().toUpperCase(); S.tier=CODES[code]||'general'; S.trialStart = S.tier==='counseled'?today():''; S.talkTrialUsed=false;
      if(code && !CODES[code]) toast('招待コードが見つからなかったので、一般（面談前）で始めます。');
      save(); go('home'); break; }
    case 'settier': S.tier=d.t; S.trialStart = d.t==='counseled'?today():''; S.talkTrialUsed=false; S.askCount={d:'',n:0}; save(); render(); toast(`区分を「${TIER_NAME[d.t]}」にしました。`); break;
    case 'expire': S.tier='counseled'; S.trialStart=addDays(-(TRIAL_DAYS+1)); save(); render(); toast('お試しを期限切れにしました（一般と同じ範囲になります）。'); break;
    case 'upsell': { const m=b.parentElement.querySelector('.upsell-msg'); if(COUNSEL_URL){ window.open(COUNSEL_URL,'_blank','noopener'); } else if(m){ m.textContent='申し込み先を準備中です。セブ島留学バディーのサイトからご相談ください。'; } break; }
    case 'code': { const c=($('#me-code')?.value||'').trim().toUpperCase(); const tt=CODES[c];
      if(!tt){ toast('招待コードが見つかりませんでした。もう一度ご確認ください。'); break; }
      S.trialStart = tt==='counseled' ? (S.tier==='counseled'&&S.trialStart ? S.trialStart : today()) : ''; S.tier=tt; S.talkTrialUsed=false; save(); render(); toast(`「${TIER_NAME[tt]}」になりました。`); break; }
    case 'logout': S.user=''; save(); render(); break;
    case 'wipe': if(confirm('この端末に保存した学習記録・保存庫・履歴書の入力を消します。元に戻せません。消しますか？')){ S=Object.assign(S0(),{user:S.user,tier:S.tier,trialStart:S.trialStart}); save(); render(); } break;
    case 'say': say(d.t); break;
    case 'learn': PRON.id=null; document.getElementById('catdlg')?.close(); document.getElementById('cidlg')?.close(); go('learn',{cat:d.cat,lv:'all',sel:null}); break;
    case 'learnmenu': PRON.id=null; go('learn',{cat:null,sel:null}); break;
    case 'catsheet': openCatSheet(); break;
    case 'catinfo': openCatInfo(d.cat); break;
    case 'ciclose': document.getElementById('cidlg')?.close(); break;
    case 'catclose': document.getElementById('catdlg')?.close(); break;
    case 'lv': R.lv=d.lv; R.sel=null; rerender(); break;
    case 'scene': R.scene=d.s; R.sel=null; rerender(); break;
    case 'whscene': R.whScene=d.s; R.sel=null; rerender(); break;
    case 'simpick': { const x=WH_SIMS.find(s=>s.id===SIM.id); if(!x) break; SIM.picks.push(+d.k);
      const o=x.steps[SIM.picks.length-1].opts[+d.k]; if(o[0]) say(o[0]);
      if(SIM.picks.length>=x.steps.length){ const sc=SIM.picks.filter((p,i)=>x.steps[i].opts[p][2]===3).length; const p=(S.prog[x.id]=S.prog[x.id]||{}); p.simBest=Math.max(p.simBest??0,sc); save(); }
      rerender(); { const n=document.querySelector('.sim-opts')||document.querySelector('.sim-end'); if(n){ const r=n.getBoundingClientRect(); if(r.bottom>window.innerHeight-20) window.scrollBy({top:r.bottom-window.innerHeight+40,behavior:'smooth'}); } } break; }
    case 'simretry': SIM={id:SIM.id,i:0,picks:[]}; rerender(); break;
    case 'lvguide': openLvGuide(); break;
    case 'sayall': { const sd=SCENE_DL[d.id]; if(sd) say(sd.lines.map(l=>plain(l[1])).join(' ')); break; }
    case 'lvclose': document.getElementById('lvdlg')?.close(); break;
    case 'gch': R.gch=d.c; R.sel=null; rerender(); break;
    case 'noteonly': R.noteOnly=!R.noteOnly; R.sel=null; rerender(); break;
    case 'step': stepTo(+d.d); break;
    case 'sel': R.sel=d.id; PRON={id:null,url:null,rec:null,result:''}; rerender(); if(window.innerWidth<960) window.scrollTo(0,0); break;
    case 'unsel': R.sel=null; rerender(); break;
    case 'fav': setProg(d.id,{fav:!P(d.id).fav}); rerender(); break;
    case 'know': mark(d.id,d.ok==='1'); rerender(); break;
    case 'tovault': { const x=ITEMS.find(i=>i.id===d.id); if(x){ addVault(x.en,x.ja,x.scene||CATS[x.cat],'item'); rerender(); } break; }
    case 'exvault': addVault(d.en,d.ja,d.scene,'item'); rerender(); break;
    case 'pron': PRON={id:d.id,url:null,rec:null,result:''}; rerender(); break;
    case 'rec': toggleRec(); break;
    case 'judge': judge(d.t); break;
    case 'gq': { GQ[d.id]=GQ[d.id]||{}; GQ[d.id][+d.q]=+d.i; rerender(); break; }
    case 'lvpick': if(LQS.pick===null){ LQS.pick=+d.i; const q=LQS.qs[LQS.i]; if(q.opts[+d.i]===q.o[0]) LQS.score++; rerender(); } break;

    case 'vf': VF=d.f; rerender(); break;

    case 'vknow': { const v=S.vault.find(x=>String(x.id)===d.id); if(v){ Object.assign(v,review(v,d.ok==='1')); save(); rerender(); } break; }
    case 'vdel': S.vault=S.vault.filter(x=>String(x.id)!==d.id); save(); rerender(); break;
    case 'vask': { const v=S.vault.find(x=>String(x.id)===d.id); ASK={q:v?`「${v.ja}」の別の言い方は？`:'',a:null,fb:null}; go('ask'); break; }
    case 'testfrom': T={setup:{src:d.src,lv:'all',dir:'ja2en'},qs:null,i:0,score:0,pick:null}; go('test'); break;

    case 'tpick': tpick(+d.i); break;

    case 'talkstart': talkStart(d.id); break;
    case 'talkend': TALK={id:null,msgs:[],step:0,done:false}; go('talk'); break;
    case 'talkmic': { try{ const r=new SR(); r.lang='en-US'; b.classList.add('rec'); r.onresult=ev=>{ $('#talk-in').value=ev.results[0][0].transcript; }; r.onend=()=>b.classList.remove('rec'); r.start(); }catch(err){} break; }
    case 'rqstart': RQ={i:0,answers:[]}; rerender(); break;
    case 'cvcolor': cvData().color=d.c; save(); rerender(); break;
    case 'cvadd': { const r=cvData(), tpl={edu:{title:'',major:'',school:'',years:'',desc:''},exp:{role:'',length:'',company:'',place:'',years:'',desc:''},refs:{name:'',org:'',position:'',phone:'',email:''}}[d.l]; if(tpl) r[d.l].push(tpl); save(); rerender(); break; }
    case 'cvdel': cvData()[d.l].splice(+d.i,1); save(); rerender(); break;
    case 'cvphotodel': cvData().photo=''; save(); rerender(); break;
    case 'rprint': window.print(); break;
  }
});
document.addEventListener('submit', e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  if(f.dataset.form==='ask'){ const q=$('#ask-q').value.trim(); if(!q) return; if(askLeft()<=0){ toast(`今日聞ける回数（${LIMIT[tier()].ask}回）を使い切りました。`); return; } useAsk(); ASK={q,a:AI_DEMO[q]||{none:true},fb:null}; rerender(); }
  if(f.dataset.form==='vadd'){ const en=$('#va-en').value.trim(), ja=$('#va-ja').value.trim(); if(!en||!ja){ alert('英語と意味を入れてください。'); return; } addVault(en,ja,$('#va-sc').value,'manual'); rerender(); }
  if(f.dataset.form==='talk'){ talkSend($('#talk-in').value); }
  if(f.dataset.form==='rq'){ const a=$('#rq-a').value.trim(); if(!a) return; RQ.answers.push(a); RQ.i++;
    if(RQ.i>=RQS.length){ cvData(); S.resume.about = "Friendly and hardworking person with experience in customer service. Trusted to train new staff and handle busy shifts. Looking for a café or hospitality role to grow my skills and English."; save(); }
    rerender(); }
});
document.addEventListener('change', e=>{
  if(e.target.dataset.rb){ cvData()[e.target.dataset.rb]=e.target.checked; save(); rerender(); return; }
  if(e.target.dataset.file){ const fl=e.target.files&&e.target.files[0]; if(!fl) return; const kind=e.target.dataset.file, r=cvData();
    cvImage(fl, kind==='photo'?480:1100, url=>{ const bak=JSON.stringify(r);
      if(kind==='photo') r.photo=url; else if(kind==='cert') r.certs[+e.target.dataset.i].img=url; else r.certs.push({img:url,cap:''});
      if(!cvSave()){ S.resume=JSON.parse(bak); } rerender(); }); return; }
  const c=e.target.dataset.change; if(!c) return; const v=e.target.value;
  if(c==='gch') R.gch=v; else if(c==='ctype') R.ctype=v; else if(c==='whscene') R.whScene=v; else if(c==='scene') R.scene=v; else return;
  R.sel=null; rerender(); });
document.addEventListener('input', e=>{ const nk=e.target.dataset.note; if(nk){ S.notes=S.notes||{}; const v=e.target.value; if(v.trim()) S.notes[nk]=v; else delete S.notes[nk]; save(); return; } const k=e.target.dataset.r; if(k){ cvData()[k]=e.target.value; save(); cvRefresh(); return; }
  const l=e.target.dataset.rl; if(l){ cvData()[l][+e.target.dataset.i][e.target.dataset.k]=e.target.value; save(); cvRefresh(); return; }
  const c=e.target.dataset.rc; if(c){ cvData()[c]=e.target.value; save(); cvRefresh(); return; } });

let SW=null;
function swEls(){ const w=document.querySelector('.swipe-wrap'); return w?{w,el:w.querySelector('.detail'),prev:w.querySelector('.sw-hint.prev'),next:w.querySelector('.sw-hint.next')}:null; }
function swPaint(){
  if(!SW) return; SW.raf=0; const E=SW.E, dx=SW.dx, toNext=dx<0, has=SW.has, W=SW.W;
  const d = has ? dx : Math.sign(dx)*W*0.18*(1-Math.exp(-Math.abs(dx)/(W*0.18)));
  E.el.style.transform=`translate3d(${d}px,0,0)`;
  const h=toNext?E.next:E.prev, o=toNext?E.prev:E.next;
  if(h) h.style.opacity = has ? String(Math.min(1,Math.abs(dx)/(W*0.22))) : '0';
  if(o) o.style.opacity='0';
}
function swReset(E){ if(!E||!E.el) return; const el=E.el;
  el.style.transition='transform .38s cubic-bezier(.16,1,.3,1)'; el.style.transform='';
  [E.prev,E.next].forEach(h=>{ if(h){ h.style.transition='opacity .2s'; h.style.opacity='0'; } });
  setTimeout(()=>{ el.style.transition=''; },400); }
document.addEventListener('touchstart', e=>{
  SW=null; if(R.v!=='learn'||!R.sel||e.touches.length>1) return;
  if(!e.target.closest('.swipe-wrap') || e.target.closest('textarea,input,.chips,audio')) return;
  const E=swEls(); if(!E||!E.el) return;
  E.w.classList.remove('nudge');
  const x=e.touches[0].clientX, t0=performance.now();
  SW={x,y:e.touches[0].clientY,dx:0,mode:null,E,W:E.w.offsetWidth||360,pts:[[x,t0]],raf:0};
}, {passive:true});
document.addEventListener('touchmove', e=>{
  if(!SW) return; const c=e.touches[0], dx=c.clientX-SW.x, dy=c.clientY-SW.y;
  if(!SW.mode){ if(Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)) { SW.mode='h'; SW.x=c.clientX-Math.sign(dx)*1; SW.E.el.style.transition='none'; [SW.E.prev,SW.E.next].forEach(h=>{ if(h) h.style.transition='none'; }); } else if(Math.abs(dy)>8){ SW=null; return; } else return; }
  e.preventDefault();
  const E=SW.E; SW.dx=c.clientX-SW.x;
  SW.has = SW.dx<0 ? !!(E.next && !E.next.classList.contains('off')) : !!(E.prev && !E.prev.classList.contains('off'));
  const now=performance.now(); SW.pts.push([c.clientX,now]); while(SW.pts.length>2 && now-SW.pts[0][1]>100) SW.pts.shift();
  if(!SW.raf) SW.raf=requestAnimationFrame(swPaint);
}, {passive:false});
document.addEventListener('touchend', ()=>{
  if(!SW) return; const S2=SW; SW=null; if(S2.raf) cancelAnimationFrame(S2.raf); if(S2.mode!=='h') return;
  const E=S2.E, p=S2.pts, a=p[0], b=p[p.length-1], v=(b[1]-a[1])>0 ? (b[0]-a[0])/(b[1]-a[1]) : 0;
  const dir=S2.dx<0?1:-1, flick=Math.abs(v)>0.35 && Math.sign(v)===Math.sign(S2.dx);
  const go=S2.has && (Math.abs(S2.dx)>S2.W*0.28 || flick);
  if(!go){ swReset(E); return; }
  const W=S2.W, rest=W-Math.abs(S2.dx), ms=Math.round(Math.max(120,Math.min(240, rest/Math.max(Math.abs(v),1.2))));
  E.el.style.transition=`transform ${ms}ms cubic-bezier(.3,.6,.4,1), opacity ${ms}ms`;
  E.el.style.transform=`translate3d(${dir>0?-W:W}px,0,0)`; E.el.style.opacity='.3';
  setTimeout(()=>stepTo(dir), ms-10);
}, {passive:true});
document.addEventListener('touchcancel', ()=>{ if(SW){ if(SW.raf) cancelAnimationFrame(SW.raf); swReset(SW.E); SW=null; } }, {passive:true});
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(R.v==='learn' && R.sel && (e.key==='ArrowRight'||e.key==='ArrowLeft') && !document.querySelector('dialog[open]')){ if(stepTo(e.key==='ArrowRight'?1:-1)) e.preventDefault(); return; }
  const n=+e.key; if(!(n>=1&&n<=4)) return;
  if(R.v==='test' && T.qs && T.i<T.qs.length && T.pick===null && T.qs[T.i].opts[n-1]){ tpick(n-1); }
  else if(R.v==='level' && LQS.cat && !LQS.done && LQS.pick===null && LQS.qs[LQS.i] && LQS.qs[LQS.i].opts[n-1]){ document.querySelector(`[data-act=lvpick][data-i="${n-1}"]`).click(); }
});

render();
</script>
