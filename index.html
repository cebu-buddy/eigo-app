}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12201E; --surface:#1A2C29; --accent-bg:#2A7D75; --cta-bg:#C94F5E; --tl1:#2A7D75; --tl2:#2F5F94; --tl3:#B06F12; --tl4:#C94F5E; --ink:#F1EBE4; --muted:#B9AA9C; --line:#2E4642;
    --teal:#5CC2B9; --teal-ink:#7FD6CD; --mint:#1F3632; --mint2:#2A4743;

}
:root[data-theme="dark"]{
  --bg:#12201E; --surface:#1A2C29; --accent-bg:#2A7D75; --cta-bg:#C94F5E; --tl1:#2A7D75; --tl2:#2F5F94; --tl3:#B06F12; --tl4:#C94F5E; --ink:#F1EBE4; --muted:#B9AA9C; --line:#2E4642;
  --teal:#5CC2B9; --teal-ink:#7FD6CD; --mint:#1F3632; --mint2:#2A4743;
  --mango:#F7B548; --mango-soft:#3A3020; --pink:#F08791; --mango-ink:#F7B548; --pink-soft:#3A2428; --pink-ink:#F08791; --st-known:#1D3340; --st-unknown:#352A2E; --st-none:#1F3632; --head-brown:#D9B48C; --sub-ink:#D0D0D0; --lv0:#7FD6CD; --lv1:#8DBDF0; --lv2:#C3A8F2; --lv3:#F7B548; --lv4:#F08791; --ok:#5CC48A; --ng:#F08A9B; --hl:#5A4718;
  color-scheme:dark;
}
*{box-sizing:border-box}
.srch{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;color:var(--muted)}
.srch:focus-within{border-color:var(--teal);box-shadow:0 0 0 3px var(--mint2)}
.srch svg{width:18px;height:18px;flex:none}.srch input{border:0;outline:0;background:none;font-size:14px;width:100%;min-width:0;color:var(--ink)}
.srch input::-webkit-search-cancel-button{cursor:pointer}
.side .srch{margin:0 4px 14px}
.top-srch{display:none}
@media (max-width:959px){.top-srch{display:block;padding:8px 16px 10px;background:var(--surface);border-bottom:1px solid var(--line)}.top-srch input{font-size:16px}}
.sr-h{display:flex;align-items:baseline;gap:8px;margin:20px 0 8px}.sr-h h2{margin:0;font-size:17px}.sr-h .n{font-size:13px;color:var(--muted)}
.sr-li{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;margin-bottom:6px;cursor:pointer}
.sr-li:hover{border-color:var(--teal)}
.sr-li b{font-family:var(--en)}.sr-li .s{font-size:13px;color:var(--muted)}.sr-li mark{background:var(--mango-soft);color:inherit;border-radius:4px;padding:0 2px}
.sr-tag{font-size:11px;white-space:nowrap;border-radius:999px;padding:2px 8px;background:var(--mint);color:var(--teal-ink)}
.sr-more{font-size:13px;color:var(--teal-ink);background:none;border:0;cursor:pointer;padding:4px 0;font-weight:700}
.sr-none{text-align:center;padding:22px 16px;margin-top:22px}
.theme-sw{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--mint);border:1px solid var(--line)}
.theme-sw button{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;border:0;background:none;border-radius:999px;padding:6px 8px;font-size:12.5px;cursor:pointer;color:var(--muted);white-space:nowrap}
.theme-sw button svg{width:15px;height:15px;flex:none}
.theme-sw button.on{background:var(--surface);color:var(--teal-ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.side .side-theme{margin:12px 4px 0}
.side .side-theme button{padding:5px 4px;font-size:12px}
@media (min-width:960px) and (max-height:940px){html .side button.nav{padding:6px 12px}html .side .grp{margin:8px 12px 2px}html .side .brand{margin-bottom:12px}html .side .srch{margin-bottom:8px}html .side .ask-cta{padding:9px 12px}html .side .side-theme{margin-top:8px}html .side .side-pb{margin-top:8px}html .side{padding-top:14px;padding-bottom:12px}}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-weight:500;font-size:16px;line-height:1.7;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{min-height:100vh;padding-bottom:84px}
.side{display:none}
.produced{font-size:12px;color:var(--muted);margin:10px 0 0;letter-spacing:.02em}
.produced a{color:var(--teal-ink);font-weight:700;text-decoration:none}.produced a:hover{text-decoration:underline}
.produced.center{text-align:center;margin-top:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--teal-ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.brand small{font-weight:500;color:var(--muted);font-size:11px;display:block;line-height:1.2}
.brand>span{text-align:left}.brand-ic{display:flex;align-items:center;flex:none}.brand-ic svg+svg{margin-left:-8px}@media (max-width:420px){header.top .brand-ic svg+svg{margin-left:-10px}header.top .brand{gap:4px;font-size:14px;letter-spacing:0}header.top .brand small{letter-spacing:0}header.top .brand svg{width:24px;height:24px}}.brand small.sub{color:var(--sub-ink);font-weight:700;text-align:center}
.top-links{display:flex;gap:4px;flex:none}
.top .brand{min-width:0}.top .brand>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon-btn{white-space:nowrap}
@media (max-width:380px){
  .top{padding:10px 12px;gap:6px}
  .top .brand{font-size:15px;gap:6px}.top .brand svg{width:28px;height:28px}
  .top .brand small{font-size:10px}
  .icon-btn{padding:5px 9px;font-size:12px}
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="app" id="app"></div>
<script>
(function(){
  const SB_URL='https://weypkaiucqtvlmyldhwz.supabase.co', SB_KEY='sb_publishable_4t3nRP3Tm1RqlEIZaYJMzw_DoERMvPN', LINE_URL='https://lin.ee/TyLuCWw';
  const GK='cocomango_proto2_gate';
  let _g = 0;
function coco(s=56){
  return `<svg class="chara" width="${s}" height="${s}" viewBox="2 3 60 60" aria-hidden="true">
  <path d="M33 11c3-6 11-8 16-5-5 1-9 3-11 8z" fill="#3E9B5B"/><path d="M31 12c-3-6-10-8-15-5 5 1 8 3 10 8z" fill="#58B36E"/>
  <circle cx="32" cy="37" r="23" fill="#8A5A3B"/>
  <path d="M15 31c4-3 8-4 12-3M39 27c4 0 8 2 11 5M19 50c3 2 6 3 9 3" stroke="#6E452C" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="24" cy="37" r="2.8" fill="#2A1A10"/><circle cx="40" cy="37" r="2.8" fill="#2A1A10"/>
  <g stroke="#2A1A10" stroke-width="1.6" fill="none"><circle cx="24" cy="37" r="6"/><circle cx="40" cy="37" r="6"/><path d="M30 37h4"/></g>
  <circle cx="18" cy="45" r="3" fill="#D98A6E" opacity=".7"/><circle cx="46" cy="45" r="3" fill="#D98A6E" opacity=".7"/>
  <path d="M27 46c3 3 7 3 10 0" stroke="#2A1A10" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
}
function mango(s=56){
  const id = 'mg' + (++_g);
  return `<svg class="chara" width="${s}" height="${s}" viewBox="0 0 64 64" aria-hidden="true">
  <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4D65A"/><stop offset=".35" stop-color="#FFC94A"/><stop offset="1" stop-color="#F07F2E"/></linearGradient></defs>
  <path d="M31 8c2-5 8-7 13-5-3 4-7 6-13 5z" fill="#4CAF62"/><path d="M30 9V5" stroke="#6E452C" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M29 8C41 7 53 19 53 36C53 51 44 61 32 61C19 61 11 52 11 40C11 26 18 9 29 8z" fill="url(#${id})"/>
  <circle cx="24" cy="38" r="2.8" fill="#2A1A10"/><circle cx="40" cy="38" r="2.8" fill="#2A1A10"/>
  <circle cx="25" cy="37" r="1" fill="#fff"/><circle cx="41" cy="37" r="1" fill="#fff"/>
  <circle cx="19" cy="45" r="3.2" fill="#F26D5B" opacity=".55"/><circle cx="45" cy="45" r="3.2" fill="#F26D5B" opacity=".55"/>
  <path d="M27 45c3 3.5 7 3.5 10 0" stroke="#2A1A10" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`;
}
  const app=document.getElementById('app');
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const getGate=()=>{ try{ return JSON.parse(localStorage.getItem(GK)||'{}')||{}; }catch(e){ return {}; } };
  const setGate=g=>{ try{ localStorage.setItem(GK, JSON.stringify(g)); }catch(e){} };

  async function rpc(name, args){
    const r=await fetch(SB_URL+'/rest/v1/rpc/'+name,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});
    if(!r.ok) throw new Error('rpc '+r.status);
    return r.json();
  }
  // 端末の保存場所（IndexedDB）。使えない端末では、毎回受け取る
  function idb(mode, fn){
    return new Promise(res=>{
      try{
        const q=indexedDB.open('eigo_app_bundle',1);
        q.onupgradeneeded=()=>q.result.createObjectStore('b');
        q.onerror=()=>res(null);
        q.onsuccess=()=>{ try{ const tx=q.result.transaction('b',mode); const st=tx.objectStore('b'); const rq=fn(st);
          tx.oncomplete=()=>res(rq&&rq.result!==undefined?rq.result:null); tx.onerror=()=>res(null); }catch(e){ res(null); } };
      }catch(e){ res(null); }
    });
  }
  const cacheGet=()=>idb('readonly',st=>st.get('app'));
  const cachePut=v=>idb('readwrite',st=>st.put(v,'app'));
  const cacheDel=()=>idb('readwrite',st=>st.delete('app'));

  function run(body){
    app.classList.remove('is-welcome'); app.innerHTML='';
    const s=document.createElement('script'); s.textContent=body; document.body.appendChild(s);
  }
  function shell(inner){
    app.classList.add('is-welcome');
    app.innerHTML=`<main id="main" class="welcome-main"><div style="padding-top:8vh">
      <div class="row" style="gap:4px">${coco(84)}${mango(84)}</div>${inner}</div></main>`;
  }
  function loading(msg){
    shell(`<h1 class="wl-h1">「今、言えなかった」を、次は言えるように。</h1><p class="muted">${esc(msg)}</p>`);
  }
  function entry(msg, busy, val){
    shell(`<h1 class="wl-h1">「今、言えなかった」を、次は言えるように。</h1>
      <p class="muted">このアプリは、入場コードをお持ちの方だけが使えます。コードは、セブ島留学バディーからお渡ししています。</p>
      <div class="panel stack" style="margin-top:16px">
        <h3 style="margin:0">入場コードを入れる</h3>
        <form class="stack" id="ld-form" style="gap:8px">
          <div><label class="f" for="ld-code">入場コード</label><input type="text" id="ld-code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="例: ABCD1234" required value="${esc(val||'')}"></div>
          ${msg?`<p class="lg-msg err" role="alert">${esc(msg)}</p>`:''}
          <button class="btn primary en-go" type="submit" ${busy?'disabled':''}>${busy?'確かめています…':'入る'}</button>
        </form>
        <p class="muted small" style="margin:0">コードを入れるのは、この端末で最初の1回だけです。コードをお持ちでない方は、LINEでお問い合わせください。</p>
        <a class="btn sm gate-line" href="${esc(LINE_URL)}" target="_blank" rel="noopener">LINEで問い合わせる</a>
      </div>`);
    const f=document.getElementById('ld-form'), inp=document.getElementById('ld-code');
    if(!busy && inp) inp.focus();
    f.addEventListener('submit', async e=>{
      e.preventDefault();
      const code=(inp.value||'').trim().toUpperCase();
      if(!code){ entry('入場コードを入れてください。'); return; }
      entry('', true, code);
      let got;
      try{ got=await rpc('get_app_bundle',{p_code:code}); }
      catch(err){ entry('通信できませんでした。少し待ってから、もう一度お試しください。', false, code); return; }
      if(!got || !got.b){ entry('入場コードが違うか、使えなくなっています。もう一度ご確認ください。', false, code); return; }
      const g=getGate(); g.entry=true; g.code=code; setGate(g);
      await cachePut({v:got.v, b:got.b});
      run(got.b);
    });
  }

  async function start(){
    const g=getGate();
    if(!g.code){ entry(); return; }
    loading('読み込んでいます…');
    const cached=await cacheGet();
    let ver;
    try{ ver=await rpc('app_bundle_version',{p_code:g.code}); }
    catch(e){ if(cached&&cached.b){ run(cached.b); return; } entry('通信できませんでした。通信を確かめて、ページを開き直してください。', false, g.code); return; }
    if(ver==null){   // コードが使えなくなった
      g.entry=false; delete g.code; setGate(g); await cacheDel();
      entry('入場コードが変わりました。新しいコードを入れてください。'); return;
    }
    if(cached && cached.v===ver && cached.b){ run(cached.b); return; }
    if(!cached) loading('はじめて開くときは、少し時間がかかります…');
    try{
      const got=await rpc('get_app_bundle',{p_code:g.code});
      if(got && got.b){ await cachePut({v:got.v, b:got.b}); run(got.b); return; }
    }catch(e){}
    if(cached&&cached.b){ run(cached.b); return; }
    entry('読み込めませんでした。少し待ってから、もう一度お試しください。', false, g.code);
  }
  start();
})();
</script>
</body>
</html>
