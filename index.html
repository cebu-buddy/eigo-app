<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ココマンゴー英語 ベータ版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F8F7; --surface:#FFFFFF; --ink:#3D2613; --muted:#6E5A4B; --line:#D5E6E3;
  --teal:#49B0A8; --teal-ink:#2C7A73; --mint:#E7F4F3; --mint2:#CFE8E5;
  --mango:#F5A524; --mango-soft:#FDF0D5; --pink:#E76874; --ok:#2E8B57; --ng:#C8455A; --hl:#FCE7B2;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --en:"Lexend","Helvetica Neue",Arial,sans-serif;
  --ipa:"Charis SIL","Doulos SIL","Lucida Grande","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12201E; --surface:#1A2C29; --ink:#F1EBE4; --muted:#B9AA9C; --line:#2E4642;
    --teal:#5CC2B9; --teal-ink:#7FD6CD; --mint:#1F3632; --mint2:#2A4743;
    --mango:#F7B548; --mango-soft:#3A3020; --pink:#F08791; --ok:#5CC48A; --ng:#F08A9B; --hl:#5A4718;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12201E; --surface:#1A2C29; --ink:#F1EBE4; --muted:#B9AA9C; --line:#2E4642;
  --teal:#5CC2B9; --teal-ink:#7FD6CD; --mint:#1F3632; --mint2:#2A4743;
  --mango:#F7B548; --mango-soft:#3A3020; --pink:#F08791; --ok:#5CC48A; --ng:#F08A9B; --hl:#5A4718;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{min-height:100vh;padding-bottom:84px}
.side{display:none}
.produced{font-size:12px;color:var(--muted);margin:10px 0 0;letter-spacing:.02em}
.produced a{color:var(--teal-ink);font-weight:700;text-decoration:none}.produced a:hover{text-decoration:underline}
.produced.center{text-align:center;margin-top:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--teal-ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.brand small{font-weight:500;color:var(--muted);font-size:11px;display:block;line-height:1.2}
.top-links{display:flex;gap:4px;flex:none}
.top .brand{min-width:0}.top .brand>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon-btn{white-space:nowrap}
@media (max-width:380px){
  .top{padding:10px 12px;gap:6px}
  .top .brand{font-size:15px;gap:6px}.top .brand svg{width:28px;height:28px}
  .top .brand small{font-size:10px}
  .icon-btn{padding:5px 9px;font-size:12px}
}
@media (max-width:345px){
  .top{padding:10px 10px}.top .brand{font-size:14px;gap:5px}.top .brand svg{width:24px;height:24px}
  .icon-btn{padding:4px 7px;font-size:11.5px}.top-links{gap:3px}
}
.icon-btn{border:0;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;border:1px solid var(--line)}
main{padding:4px 16px 24px;max-width:1080px;margin:0 auto}
.app.is-welcome{display:block!important;padding-bottom:24px}
.welcome-main{max-width:560px;width:100%}
@media (min-width:960px){.welcome-main{padding-top:4vh}}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0;border-radius:12px;cursor:pointer;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--teal-ink);font-weight:700}
.tabbar button.ask{color:var(--ink)}
.tabbar button.ask .bubble{background:var(--mango);border-radius:14px;padding:4px 12px;margin-top:-14px;box-shadow:0 2px 0 rgba(61,38,19,.18)}
.tabbar button.ask.on .bubble{background:var(--teal);color:#fff}

@media (min-width: 960px){
  .app{display:grid;grid-template-columns:236px 1fr;padding-bottom:0}
  .tabbar,.top{display:none}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
  .side .brand{margin:0 6px 18px}
  .side button.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:12px;cursor:pointer;color:var(--ink)}
  .side button.nav svg{width:20px;height:20px;flex:none}
  .side button.nav:hover{background:var(--mint)}
  .side button.nav.on{background:var(--mint2);font-weight:700;color:var(--teal-ink)}
  .side .grp{font-size:12px;color:var(--muted);margin:14px 12px 4px}
  .side .ask-cta{margin-top:auto;background:var(--mango);border:0;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.4;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;color:#2B140B}
  .side .ask-cta svg{width:20px;height:20px;flex:none}
  .side .side-pb{margin:12px 6px 0;font-size:11px}
  main{padding:28px 36px 48px}
}

h1{font-size:24px;line-height:1.35;margin:8px 0 14px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;cursor:pointer}
.btn.primary{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff;font-weight:700}
.btn.cta{background:var(--pink);border-color:var(--pink);color:#2B140B;font-weight:700}
.btn.mango{background:var(--mango);border-color:var(--mango);color:#2B140B;font-weight:700}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn.on{background:var(--mint2);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;position:relative}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip.on{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff;font-weight:700}

.ja-audio{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:4px 0 10px}
.stepnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.stepnav .btn{flex:1;max-width:220px;white-space:nowrap;padding:9px 8px;font-size:clamp(11px,3.3vw,15px);letter-spacing:-.02em}
.stepnav>span{white-space:nowrap}
.gsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gsel select{flex:1 1 100%;min-width:0;max-width:460px;font-size:16px;font-weight:600;color:var(--ink);border:1.5px solid var(--teal);background:var(--surface);appearance:none;-webkit-appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--teal-ink) 50%),linear-gradient(135deg,var(--teal-ink) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.gsel .chip{flex:none}
.swipe-wrap{position:relative;touch-action:pan-y;overflow-x:clip}
.swipe-wrap .detail{will-change:transform}
.sw-hint{position:absolute;top:12px;z-index:2;display:none;flex-direction:column;gap:2px;max-width:46%;color:var(--teal-ink);opacity:0;pointer-events:none}
.sw-hint.prev{left:6px;align-items:flex-start;text-align:left}.sw-hint.next{right:6px;align-items:flex-end;text-align:right}
.sw-hint span{font-size:22px;line-height:1;font-family:var(--en);font-weight:600}
.sw-hint small{font-size:11px;color:var(--muted);white-space:nowrap}
.sw-hint small b{display:block;font-family:var(--en);font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.sw-hint.off{display:none!important}
@media (max-width:959px){.sw-hint{display:flex}}
.seltop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.seltop .back{margin-bottom:0!important}
.mininav{display:none;align-items:center;gap:2px;margin-left:auto}
.mininav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--teal-ink);font-size:20px;line-height:1;font-family:var(--en);cursor:pointer;opacity:.75}
.mininav button:disabled{opacity:.25;cursor:default}
.mininav span{font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-family:var(--en)}
@media (max-width:959px){.split.has-sel .mininav{display:flex}}
@media (min-width:960px){.seltop{display:none}}
.swipe-wrap.nudge .detail{animation:nudge 1.2s .6s cubic-bezier(.45,0,.25,1)}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-22px)}55%{transform:translateX(0)}72%{transform:translateX(-7px)}86%{transform:none}}
.detail.in-next{animation:inNext .34s cubic-bezier(.16,1,.3,1)}.detail.in-prev{animation:inPrev .34s cubic-bezier(.16,1,.3,1)}
@keyframes inNext{from{opacity:.2;transform:translateX(38%)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:.2;transform:translateX(-38%)}to{opacity:1;transform:none}}
.ipa-big{font-family:var(--ipa);font-size:30px}
.lq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0 8px}
.lq-cell{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lq-name{font-size:13px;color:var(--muted)}
.lq-lv{font-weight:700;color:var(--teal-ink)}
.lq-bar{display:flex;gap:3px}.lq-bar i{width:18px;height:6px;border-radius:3px;background:var(--line)}.lq-bar i.on{background:var(--teal)}
svg.growth{width:100%;max-width:640px;height:auto;margin-top:6px;display:block}
.g-grid{stroke:var(--line);stroke-width:1}
.g-axis{fill:var(--muted);font-size:11.5px;font-family:var(--jp)}
.g-line{fill:none;stroke:var(--teal-ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g-dot{fill:var(--teal-ink);stroke:var(--surface);stroke-width:2}
.g-val{fill:var(--ink);font-size:12.5px;font-weight:700;font-family:var(--jp)}
.up{color:var(--ok)}
.cat-gl{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:700px){.catgrid{grid-template-columns:repeat(4,1fr)}}
.catwrap{position:relative;display:flex}.catwrap>.catcard{flex:1;padding-right:36px}
.catinfo{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:transparent;color:var(--teal-ink);border-radius:50%;cursor:pointer;padding:0;flex:none;vertical-align:middle}
.catinfo svg{width:20px;height:20px}.catinfo:hover{background:var(--mint)}
.catwrap>.catinfo{position:absolute;top:4px;right:4px;opacity:.75}
.ci-cmp td,.ci-cmp th{font-size:13px}.ci-cmp tr.here{background:var(--mango-soft)}.ci-cmp tr.here th{font-weight:700}
.catcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-height:78px;cursor:pointer;color:var(--ink)}
.catcard:hover{border-color:var(--teal)}
.catcard b{font-size:15px}.catcard .n{font-size:11.5px;color:var(--muted)}
.cbar{display:block;width:100%;height:5px;background:var(--mint);border-radius:9px;margin-top:auto;overflow:hidden}.cbar i{display:block;height:100%;background:var(--teal)}
.crumbrow{margin:4px 0 2px}
.cat-title{font-size:24px}
.catswitch{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.catswitch .sw{font-size:12px;font-weight:700;border:1.5px solid var(--teal);color:var(--teal-ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:560px;max-height:85vh;border:0;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));background:var(--surface);color:var(--ink);box-shadow:0 -8px 30px rgba(61,38,19,.2)}
dialog.sheet[open]{animation:sheetUp .26s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
dialog.sheet::backdrop{background:rgba(30,40,38,.45)}
.sheet-grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheetgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sheetgrid button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;text-align:left;font-size:14px;cursor:pointer}
.sheetgrid button.on{border:2px solid var(--teal);background:var(--mint);font-weight:700}
.learn-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:6px}
.learn-head h1{margin:8px 0}
.mylist{display:flex;gap:6px}
.mybtn{border:1.5px solid var(--mango);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.mybtn b{font-family:var(--en);margin-left:2px}
.mybtn.on{background:var(--mango);color:#2B140B;font-weight:700}
.filter-l{font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:500}
.chips.cats .chip{border-radius:12px;padding:9px 16px;font-size:15px;font-weight:500;border-width:1.5px}
.chips.cats .chip.on{font-weight:700}
.filter{margin-top:10px;padding:10px 12px 6px;background:var(--mint);border-radius:14px}
.chips.sub .chip{font-size:13px;padding:3px 12px;background:var(--surface);border-color:transparent}
.chips.sub .chip.on{background:var(--mango-soft);border-color:var(--mango);color:var(--ink)}
.linkbtn{flex:none;border:0;background:none;color:var(--teal-ink);text-decoration:underline;font-size:13px;cursor:pointer;padding:3px 6px}
dialog.modal{width:calc(100% - 32px);max-width:680px;max-height:86vh;border:0;border-radius:20px;padding:0 18px 18px;background:var(--bg);color:var(--ink);box-shadow:0 12px 40px rgba(61,38,19,.25)}
dialog.modal::backdrop{background:rgba(30,40,38,.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:16px 0 10px;z-index:1}
.phrase-card{margin:14px 0 12px;padding:14px 16px;border-radius:16px;background:var(--mint);border:1px solid var(--mint2)}
textarea.note{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--mango-soft);line-height:1.7}
.st.note{background:var(--mango-soft);color:var(--ink);border-radius:999px;padding:1px 8px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--mint);color:var(--teal-ink);vertical-align:middle}
.tag.lv{background:var(--mango-soft);color:var(--ink)}
.en{font-family:var(--en);letter-spacing:.005em}
.ipa{font-family:var(--ipa);color:var(--muted);font-size:15px}
.syn{font-size:13px;margin:-2px 0 10px;line-height:1.8}
.syn-l{display:inline-block;font-size:11px;color:var(--teal-ink);background:var(--mint);border-radius:999px;padding:0 8px;margin-right:6px}
.say{border:0;background:var(--mint);color:var(--teal-ink);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none;vertical-align:middle}
.say svg{width:16px;height:16px}
.btn svg{width:16px;height:16px;vertical-align:-3px}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 3px}
input[type=text],input[type=email],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.note{background:var(--mango-soft);border-radius:12px;padding:10px 14px;font-size:13px}
.empty{text-align:center;padding:28px 12px}
.empty .chara{margin:0 auto}
.bar{height:8px;background:var(--mint2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.chara{display:block;flex:none}
.lock{display:flex;gap:14px;align-items:flex-start;border:2px dashed var(--mango)}
.lockmark{display:inline-flex;color:var(--muted)}
.lockmark svg{width:15px;height:15px}
.side .lockmark{margin-left:auto}
.tier{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
@media (min-width: 960px){#toast{bottom:32px}}
.lvtable{width:100%;border-collapse:collapse;font-size:13px}
.lvtable th,.lvtable td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
@media (min-width: 600px){.lvtable{font-size:14px}.lvtable th,.lvtable td{padding:10px 12px}}
.lvtable thead th{font-size:12px;color:var(--muted);font-weight:500}
.lvtable tbody th{color:var(--teal-ink);white-space:nowrap}
.lvsub{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.lvtable tr.ref th,.lvtable tr.ref td{color:var(--muted);border-bottom:0}
.lvtable tr.def td{font-size:13px;color:var(--muted);padding-top:0;border-bottom:1px solid var(--mint2)}
.lvtable tr:has(+ .def) th,.lvtable tr:has(+ .def) td{border-bottom:0}

.greet{display:flex;align-items:flex-end;gap:10px;margin:6px 0 18px}
.speech{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 16px;max-width:520px}
.speech b{display:block;font-size:13px;color:var(--teal-ink)}
.hero-study{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--teal-ink);color:#fff;border-radius:22px;padding:20px;border:0;width:100%;text-align:left;cursor:pointer}
.hero-study h2{margin:0 0 4px;font-size:20px;color:#fff}
.hero-study p{margin:0;color:#DDF1EE;font-size:14px}
.hero-study .pair{display:flex;gap:2px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
@media (min-width: 960px){.home-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer}
.tile b{display:block;font-size:15px}
.tile span{font-size:13px;color:var(--muted)}
.today{display:flex;gap:16px;align-items:center}
.today .num{font-family:var(--en);font-size:34px;font-weight:600;color:var(--teal-ink);line-height:1}

.split{display:grid;gap:14px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;cursor:pointer;width:100%}
.li.sel{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}

const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today = ()=>new Date().toISOString().slice(0,10);
const addDays = n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const STEPS = [1,3,7,14,30];
const P = id=>S.prog[id]||{};
function setProg(id,patch){ S.prog[id]=Object.assign({},P(id),patch); save(); }
function review(obj,ok){
  if(ok){ const st=Math.min((obj.step??-1)+1,STEPS.length-1); return {state:'known',step:st,next:addDays(STEPS[st])}; }
  return {state:'unknown',step:-1,next:addDays(1)};
}
function mark(id,ok){ setProg(id,review(P(id),ok)); }

const SIM_MARK = ['×','△','○','◎'], SIM_WORD = ['避けたい','もう一歩','通じる','とても自然'];
let SIM = {id:null,i:0,picks:[]};
function simDetail(x){
  if(SIM.id!==x.id) SIM={id:x.id,i:0,picks:[]};
  const done=SIM.picks.length, end=done>=x.steps.length;
  const bub=(who,en,ja,extra='')=>`<div class="dlg-line ${who==='mango'?'right':''}">${CH[who].svg(44)}<div class="bub"><div class="who">${esc(x.roles[who])}</div><div class="row"><span class="en">${esc(en)}</span>${sayBtn(en)}</div><div class="muted small">${esc(ja)}</div>${extra}</div></div>`;
  let h='';
  x.steps.forEach((s,i)=>{ if(i>done) return;
    h+=bub('coco',s.en,s.ja);
    if(i<done){ const o=s.opts[SIM.picks[i]], best=s.opts.find(p=>p[2]===3);
      h+=bub('mango',o[0],o[1],`<p class="sim-fb g${o[2]}"><b>${SIM_MARK[o[2]]} ${SIM_WORD[o[2]]}</b>　${esc(o[3])}</p>${o[2]<3?`<p class="small" style="margin:4px 0 0">おすすめ: <span class="en">${esc(best[0])}</span> ${sayBtn(best[0])}</p>`:''}`); }
    else h+=`<p class="filter-l" style="margin:4px 0 6px">あなたの返事を選んでください</p><div class="sim-opts">${s.opts.map((o,k)=>`<button class="sim-opt" data-act="simpick" data-k="${k}"><span class="en">${esc(o[0])}</span><span class="muted small">${esc(o[1])}</span></button>`).join('')}</div>`;
  });
  const score=SIM.picks.filter((p,i)=>x.steps[i].opts[p][2]===3).length;
  return `<div class="panel detail">
    <div class="row" style="justify-content:space-between"><div><span class="tag">シミュレーション</span> <span class="tag">${esc(x.scene)}</span></div>${favBtn(x.id)}</div>
    <h2 style="margin:6px 0 4px">${esc(x.title)}</h2>
    <div class="note" style="margin-bottom:12px"><b>場面</b><br>${esc(x.setup)}</div>
    ${h}
    ${end?`<div class="sim-end"><p style="margin:0"><b>結果: ◎ ${score} / ${x.steps.length}</b></p><p class="small muted" style="margin:4px 0 8px">${score===x.steps.length?'すべて自然な返事でした。実際の場面でも、そのまま使えます。':'◎以外の返事には、おすすめの言い方を出しています。もう一度やると、身につきます。'}</p><button class="btn primary sm" data-act="simretry">もう一度</button></div>`:''}
  </div>`;
}

 ["【基本の考え方】英語の否定文は「not をどこに置くか」で決まります。動詞の種類によって3つのパターンがあります。", "【① be動詞の文】be動詞のあとに not（I'm not ready. / It isn't far. / They weren't at home.）。", "【② 一般動詞の文】動詞の前に don't / doesn't / didn't を置き、動詞は原形に戻します。主語が he / she / it なら doesn't、過去なら主語に関係なく didn't です。She doesn't eat meat.（× doesn't eats）／I didn't sleep well.（× didn't slept）。", "【③ 助動詞の文】can / will / should / must などのあとに not を置きます。can not はふつう can't（cannot）、will not は won't、should not は shouldn't。助動詞のあとの動詞は原形のままです。", "【have の場合】have が「持っている」の意味なら一般動詞なので don't have（I don't have a visa.）。現在完了の have は助動詞なので haven't（I haven't finished yet.）。", "【命令文の否定】Don't ＋ 動詞の原形（Don't worry.）。be動詞の命令文も Don't be ~（Don't be shy.）。", "【二重否定に注意】英語では not と never / nothing / nobody を一緒に使いません。× I don't know nothing. → ○ I don't know anything. または I know nothing."],
 [["I'm not sure.",'よく分かりません。'],["He doesn't eat meat.",'彼は肉を食べません。'],["I can't swim.",'泳げません。']],
 [Q('She ___ like coffee.',['don\'t','doesn\'t','isn\'t'],1,'she ＋ 一般動詞の否定は doesn\'t。'),Q('I ___ go to class yesterday.',['didn\'t','don\'t','wasn\'t'],0,'過去の一般動詞の否定は didn\'t ＋ 原形。')]);
G('1','gr:prog',0,'現在進行形（I am doing）',
 ["【形】be動詞（am / is / are）＋ 動詞の -ing 形。I'm working. / She's studying. / They're waiting. 否定は I'm not working.、疑問は Are you working?", "【① 今まさにしていること】話している瞬間に進行中で、まだ終わっていない動作に使います。What are you doing? — I'm cooking dinner. 「〜しているところ」というイメージです。", "【② 今の時期だけしていること】話している瞬間にしていなくても、「始まったけれど、まだ終わっていない」ことにも使います。I'm studying English in Cebu this month.（今月はセブで英語を勉強中）。today / this week / these days など「今を含む期間」と一緒によく使います。", "【③ 変化している途中】get / become / improve / increase など、変わりつつあることにも使います。My English is getting better.（英語が上達してきている）。", "【④ 近い未来の予定】すでに決まって準備している予定にも使います（I'm leaving tomorrow.）。くわしくは未来の単元で扱います。", "【進行形にしない動詞】like / love / want / need / know / understand / believe / remember / belong など「気持ち・考え・状態」を表す動詞は、ふつう進行形にしません。× I'm wanting a coffee. → ○ I want a coffee.／× Are you understanding? → ○ Do you understand?", "【-ing の作り方】ふつうは -ing を付けるだけ。e で終わる語は e を取る（make → making）。短い語で「母音1つ＋子音1つ」で終わるものは子音を重ねる（run → running, swim → swimming）。ie で終わる語は ying（lie → lying）。"],
 [["I'm eating lunch now.",'今お昼を食べています。'],["What are you doing?",'何してるの？'],["I'm staying at the school dorm.",'学校の寮に泊まっています。']],
 [Q('Look! It ___.',['rains','is raining','rain'],1,'今まさに起きていることは進行形。'),Q('I ___ the answer.',['know','am knowing','knowing'],0,'know は状態を表すので進行形にしません。')]);
G('2','gr:simple',0,'現在形（I do / he does）と、否定文・疑問文',
 ["【形】主語が I / you / we / they のときは動詞の原形、he / she / it と1人・1つのときは -s / -es を付けます（I work / She works）。have は has になります。", "【① 習慣・くり返し】いつもしていること、くり返していることに使います。I get up at six. / She goes to the gym three times a week. always / usually / often / sometimes / never などの頻度を表す言葉は、ふつう一般動詞の前に置きます（I usually walk to school.）。", "【② いつも本当のこと】事実や一般的なこと、長く続いている状態に使います。The sun rises in the east. / My parents live in Osaka. / Cebu has many beaches.", "【③ 時刻表・スケジュール】決まった時刻表にも使います（The bus leaves at 8:15.）。", "【-s の付け方】ふつうは -s（works）。s / sh / ch / x / o で終わる語は -es（watches, goes, does）。「子音＋y」は y を i にして -es（study → studies）。発音は /s/ /z/ /ɪz/ の3通りあります。", "【否定・疑問】don't / doesn't、Do / Does を使い、動詞は原形に戻します。Does she speak Tagalog?（× Does she speaks）。答えは Yes, she does. / No, she doesn't.", "【What do you do?】「何をしていますか」ではなく「お仕事は何ですか」という意味の決まった質問です。答えは I'm a nurse. / I work in IT. など。"],
 [["I study English every day.",'毎日英語を勉強しています。'],["She lives in Manila.",'彼女はマニラに住んでいます。'],["Do you like mango?",'マンゴーは好き？']],
 [Q('My teacher ___ from Cebu.',['come','comes','coming'],1,'my teacher（単数）なので -s。'),Q('___ he play basketball?',['Do','Does','Is'],1,'he の疑問文は Does。')]);
G('101','gr:was',0,'be動詞の過去形（was / were）',
 ["【形】am / is の過去は was、are の過去は were です。I / he / she / it と1人・1つのものには was、you / we / they と2人・2つ以上には were を使います。", "【使い方】「〜だった」「〜にいた・あった」と、過去の様子や場所を言うときに使います。I was tired last night. / The beach was beautiful. / Where were you yesterday?", "【否定】was not → wasn't、were not → weren't（The shops weren't open.）。", "【疑問】Was / Were を主語の前に出します（Was the test difficult? / Were they kind?）。答えは Yes, it was. / No, they weren't.", "【there was / there were】「〜があった・いた」は There was a big party. / There were many people. のように言います。", "【よく使う場面】感想を伝えるとき、was を使うと自然です。How was your weekend? — It was great!／How was the food? — It was a bit spicy.", "【よくある間違い】be動詞の過去形と一般動詞の過去形を一緒に使わないこと。× I was went to the mall. → ○ I went to the mall."],
 [["I was tired yesterday.",'昨日は疲れていました。'],["The food was delicious.",'料理がとてもおいしかった。'],["Were you at school?",'学校にいたの？']],
 [Q('We ___ in Bohol last weekend.',['was','were','are'],1,'we には were。'),Q('___ the test difficult?',['Was','Were','Did'],0,'the test（単数）なので Was。')]);
G('3','gr:simpleprog',1,'現在形と現在進行形の使い分け',
 ["【基本の違い】現在進行形（I'm doing）は「今・この時期だけ・まだ途中」、現在形（I do）は「いつも・くり返し・ずっと変わらないこと」を表します。", "【比べてみよう①】I'm working at a café this summer.（この夏だけ・一時的）／I work at a café.（ふだんの仕事）。一時的なら進行形、長く続くなら現在形です。", "【比べてみよう②】It's raining.（今、雨が降っている）／It rains a lot in September.（9月は雨が多い・一般的なこと）。", "【頻度の言葉】always / usually / every day など「くり返し」を表す言葉があれば、ふつう現在形です（I always take the jeepney.）。now / right now / at the moment / this week などがあれば進行形が自然です。", "【always ＋ 進行形】「いつも〜してばかり」という不満やあきれた気持ちを表します。He's always losing his phone.（しょっちゅうスマホをなくす）。ただの習慣なら現在形（He always calls his mom on Sundays.）。", "【進行形にしない動詞】know / like / want / need / believe / mean / belong などは「今」でも現在形です（I know what you mean.）。think は「〜と思う（意見）」なら現在形（I think it's a good idea.）、「考え中」なら進行形が使えます（I'm thinking about my plans.）。", "【見た目・気分】look / feel は、今の様子なら現在形も進行形も使えます（You look tired. / You're looking great today.）。have も「食べる・過ごす」の意味なら進行形にできます（We're having lunch.）が、「持っている」の意味ではできません。"],
 [["I usually walk to school, but today I'm taking a taxi.",'ふだんは歩いて学校に行くけど、今日はタクシーにしている。'],["She speaks three languages.",'彼女は3か国語を話します。']],
 [Q('I ___ TV every night.',['watch','am watching','watching'],0,'毎晩の習慣なので現在形。'),Q('Be quiet! The baby ___.',['sleeps','is sleeping','sleep'],1,'今まさに寝ているので進行形。')]);
G('4','gr:past',0,'過去形（I did）と、否定文・疑問文（didn\'t / Did you ~?）',
 ["【使い方】過去に終わったこと・過去のある時点で起きたことを表します。yesterday / last week / two days ago / in 2020 / when I was a child など、過去の時を表す言葉とよく一緒に使います。", "【規則動詞】-ed を付けます（work → worked）。e で終わる語は -d（live → lived）。「子音＋y」は y を i にして -ed（study → studied）。短い語で「母音1つ＋子音1つ」は子音を重ねる（stop → stopped）。", "【-ed の発音】/t/（worked, watched）、/d/（played, lived）、/ɪd/（wanted, needed）の3通りです。t / d で終わる語だけ「イド」と1音増えます。", "【不規則動詞】よく使う動詞ほど不規則です。go → went、have → had、get → got、make → made、see → saw、eat → ate、take → took、come → came、buy → bought、say → said。「規則動詞と不規則動詞」の単元でまとめて練習します。", "【否定】主語に関係なく didn't ＋ 動詞の原形（I didn't go. / She didn't call.）。", "【疑問】Did ＋ 主語 ＋ 動詞の原形（Did you enjoy the trip?）。疑問詞は前に置きます（Where did you go? / What did you eat?）。didn't や did を使ったら、動詞は原形に戻すのが最大のポイントです（× Did you went?）。", "【do が本動詞のとき】「何をしたの？」は What did you do?（do が2回）。答えは I didn't do anything. のように言います。"],
 [["I went to the mall yesterday.",'昨日モールに行きました。'],["Did you sleep well?",'よく眠れた？'],["I didn't understand the question.",'質問が分かりませんでした。']],
 [Q('Did you ___ the movie?',['saw','see','seen'],1,'Did のあとは原形。'),Q('Last night I ___ pizza.',['eat','ate','eaten'],1,'eat の過去形は ate。')]);
G('5','gr:pastprog',1,'過去進行形（I was doing）と、過去形との使い分け',
 ["【形】was / were ＋ 動詞の -ing 形。I was sleeping. / They were studying. 否定は wasn't / weren't ＋ -ing、疑問は Were you sleeping?", "【意味】過去のある時点で「〜しているところだった」「まだ途中だった」ことを表します。What were you doing at 10 p.m. last night? — I was watching a movie.", "【過去形との違い】過去進行形は「途中」、過去形は「最初から最後まで終わったこと」です。I was reading a book last night.（読んでいる途中だった）／I read a book last night.（1冊読んだ）。", "【組み合わせ①：途中で何かが起きた】長く続いていた動作は過去進行形、その途中で起きた短い出来事は過去形にします。I was walking to school when it started to rain.（歩いていたら雨が降り出した）。while ＋ 過去進行形もよく使います（I lost my wallet while I was shopping.）。", "【組み合わせ②：順番に起きた】出来事が順番に起きたなら、どちらも過去形です。When the teacher came in, we stopped talking.（先生が来て、それから話すのをやめた）。比べてみましょう：When I arrived, they were having dinner.（着いたとき、もう食べ始めていた）／When I arrived, they had dinner.（着いてから、食べた）。", "【場面の描写】物語や思い出話の背景を説明するときにも使います（It was a sunny day. People were swimming and kids were playing on the beach.）。", "【進行形にしない動詞】know / want / like などは過去でも進行形にしません（× I was knowing him. → ○ I knew him.）。"],
 [["I was studying at 10 p.m.",'夜10時は勉強していました。'],["It started to rain while we were walking.",'歩いている途中で雨が降り出した。']],
 [Q('What ___ you doing at eight last night?',['did','were','was'],1,'you ＋ 過去進行形は were。'),Q('I was cooking when the phone ___.',['rang','was ringing','rings'],0,'途中で起きた短い出来事は過去形。')]);
G('6','gr:ever',1,'現在完了（I have done）と、経験を聞く Have you ever ~?',
 ["【形】have / has ＋ 過去分詞。I've（I have）/ She's（She has）と短縮することが多いです。過去分詞は規則動詞なら過去形と同じ（worked）、不規則動詞は別の形もあります（go – went – gone、eat – ate – eaten、see – saw – seen）。", "【考え方】現在完了は「過去の出来事」を「今の話」として伝える形です。過去に何があったかより、「その結果、今どうなのか」「今までに何回あるのか」に関心があります。", "【① 経験：〜したことがある】生まれてから今までの間の経験を言います。I've been to Bohol twice. / I've never tried balut. 回数は once / twice / three times、「今までに」は ever、「一度も〜ない」は never。", "【経験を聞く】Have you ever ＋ 過去分詞 ~?（今までに〜したことはありますか）。答えは Yes, I have. / No, I haven't. / No, never. 会話をつなげるときは、詳しい話を過去形で続けます：Have you been to Japan? — Yes, I have. I went there last year.", "【② 完了・結果：もう〜した（だから今…）】I've lost my key.（なくした→今も見つかっていない）／She's just arrived.（ちょうど着いたところ）。just / already / yet と一緒によく使います（Have you finished yet?）。", "【been と gone】He has been to Manila.（行ったことがある・もう帰ってきた）／He has gone to Manila.（行ってしまった・今はいない）。経験を言うときは been を使います。", "【いっしょに使わない言葉】yesterday / last week / in 2020 / ~ ago のように、終わった過去の時をはっきり言う言葉とは使いません。× I've been to Bohol last year. → ○ I went to Bohol last year.（「現在完了と過去形の違い」の単元も見てください）"],
 [["I've been to Australia twice.",'オーストラリアに2回行ったことがあります。'],["Have you ever tried balut?",'バロットを食べたことはある？'],["I've never seen snow.",'雪を見たことがありません。']],
 [Q('Have you ever ___ sushi?',['ate','eaten','eat'],1,'have のあとは過去分詞 eaten。'),Q('I ___ to Cebu last year.',['have gone','went','have been'],1,'last year は終わった過去なので過去形。')]);
G('15','gr:goingto',0,'be going to',
 ["【形】be動詞（am / is / are）＋ going to ＋ 動詞の原形。I'm going to visit Oslob. 否定は I'm not going to ~、疑問は Are you going to ~?", "【① もう決めている予定・つもり】話す前から「そうしよう」と決めていることに使います。I'm going to take the IELTS next year. / What are you going to do this weekend? その場で今決めたことには will を使うので、使い分けがポイントです。", "【② 今の様子から分かる予想】目の前の状況から「このままだと〜しそうだ」と言うときに使います。Look at those clouds. It's going to rain.（雲が見えている）／Hurry up! We're going to miss the bus.（今のペースだと間に合わない）。", "【進行形の未来との違い】I'm meeting Ken at six.（相手と時間まで約束済み）は現在進行形が自然です。going to は「自分の中で決めた」段階でも使えます（I'm going to clean my room.）。どちらでも通じる場面も多いです。", "【was going to】「〜するつもりだった（けれど、しなかった）」は was / were going to です。I was going to call you, but I forgot.（電話するつもりだったけど忘れた）。言い訳や予定変更を伝えるときに便利です。", "【発音】会話では going to が gonna（ガナ）のように聞こえることがよくあります。聞き取れるようにしておきましょう。ただし、書くときは going to と書きます。", "【よくある間違い】be動詞を落とさないこと。× I going to study. → ○ I'm going to study. to のあとは原形です（× going to studied）。"],
 [["I'm going to study in Cebu for three months.",'セブで3か月勉強するつもりです。'],["What are you going to do this weekend?",'今週末は何をするつもり？']],
 [Q('I\'m going to ___ my friend tomorrow.',['meet','meeting','met'],0,'going to のあとは原形。'),Q('Watch out! You ___ fall!',['will going to','are going to','going to'],1,'今の様子からの予想は be going to。')]);
G('16','gr:will',1,'will と shall',
 ["【形】will ＋ 動詞の原形（主語に関係なく形は同じ）。短縮は I'll / you'll / it'll、否定は won't（will not）。", "【① その場で決めたこと】話しながら今決めたことに使います。I'm thirsty. — I'll get you some water.／(注文で) I'll have the pork adobo, please. すでに決めていた予定には使いません（× I'll go to Bohol next week, I booked it. → ○ I'm going to Bohol next week.）。", "【② 申し出・約束・引き受け】I'll help you.（手伝うよ）／I'll pay you back tomorrow. I promise.／I won't tell anyone.（誰にも言わない）。", "【③ 予想・意見】自分の考えとしての未来の予想に使います。I think she'll pass the test. / It'll be sunny tomorrow. I think / I'm sure / probably / maybe と一緒によく使います（I'll probably be late.）。「〜しないと思う」は I don't think I'll ~ の形が自然です。", "【won't で「どうしても〜しない」】The door won't open.（ドアがどうしても開かない）／My son won't eat vegetables. 物や人が「言うことを聞かない」ときにも使います。", "【Will you ~? のお願い】Will you close the window? は「〜してくれる？」という頼み方ですが、少し強く聞こえることがあります。ていねいに頼むなら Could you ~? がおすすめです。", "【shall】今は主に Shall I ~?（〜しましょうか・申し出）と Shall we ~?（〜しましょうか・誘い）の質問で使います。Shall I open the window? / Shall we go? アメリカ英語では Should I ~? / Do you want me to ~? のほうがよく使われます。"],
 [["I'll call you later.",'あとで電話するね。'],["It won't take long.",'長くはかかりません。'],["Shall I open the window?",'窓を開けましょうか？']],
 [Q('「その場で決めた」: The phone is ringing. I ___ get it.',['will','\'ll be','am going'],0,'その場で決めたことは will（I\'ll）。'),Q('will の否定の短い形は？',['willn\'t','won\'t','don\'t will'],1,'will not の短縮形は won\'t。')]);
G('19','gr:whenif',1,'when・if のあとは現在形',
 ["【ルール】未来のことを話していても、when（〜するとき）・if（もし〜なら）のあとの部分は現在形にします。もう一方の部分（結果）は will などを使います。", "【例】I'll call you when I arrive.（× when I will arrive）／If it rains tomorrow, we'll stay home.（× If it will rain）。", "【同じルールの言葉】before（〜する前に）・after（〜したあとで）・until / till（〜するまで）・as soon as（〜したらすぐに）・while（〜している間）・unless（〜しない限り）も同じです。Wait here until I come back.／Text me as soon as you get home.", "【現在完了も使える】「〜し終わったら」と、1つめが完全に終わってから次をすることを強めたいときは、現在完了も使えます。I'll go out when I've finished my homework.（宿題を終えてから出かける）。", "【when と if の違い】when は「必ず起こると思っていること」、if は「起こるか分からないこと」に使います。When I get home, I'll call you.（必ず帰る）／If I see Ken, I'll tell him.（会うか分からない）。", "【文の順番】when / if の部分は前にも後ろにも置けます。前に置くときはコンマを付けるのがふつうです（If you need help, let me know. / Let me know if you need help.）。", "【注意】「〜かどうか」「いつ〜するか」という質問の中身（名詞のかたまり）のときは will が使えます。I don't know when he will come.（彼がいつ来るか分からない）。時を表す「〜するとき」と区別しましょう。"],
 [["I'll text you when I get home.",'家に着いたらメッセージするね。'],["If you're free, let's have dinner.",'もし空いていたら、夕食に行こう。']],
 [Q('If it ___ tomorrow, I\'ll stay home.',['will rain','rains','rained'],1,'if のあとは未来でも現在形。'),Q('Call me when you ___ at the airport.',['arrive','will arrive','arrived'],0,'when のあとは現在形。')]);
G('20','gr:can',1,'can / could / be able to',
 ["【形と意味】can ＋ 動詞の原形で「〜できる（能力）」「〜してもいい（許可）」「〜することがある（可能性）」を表します。否定は can't / cannot。can't の発音は「キャーント」と長めに、can は弱く「クン」と聞こえることが多いです。", "【could：過去の能力】「（昔は）〜できた」という一般的な能力は could です。When I was a child, I could swim really fast. see / hear / remember などとも could を使います（I couldn't hear you.）。", "【was able to：その時うまくできた】過去のある1回の場面で「（苦労したけど）できた」と言うときは、could ではなく was able to / managed to を使います。The traffic was terrible, but we were able to catch the flight.（× could catch）。否定の couldn't はどちらの場合も使えます。", "【be able to が必要なとき】can は現在形と過去形（could）しかないので、ほかの形にしたいときは be able to を使います。I'll be able to speak English better soon.（未来）／I haven't been able to sleep well.（現在完了）／I'd like to be able to cook.（to のあと）。", "【許可】Can I ~?（〜してもいい？）、You can ~（〜していいよ）。You can't park here.（ここに駐車してはいけない）のように禁止にもなります。", "【お願い】Can you ~? / Could you ~? は「〜してもらえますか」。Could のほうがていねいで、初対面の人やお店の人に向いています（Could you speak more slowly?）。", "【よくある間違い】can のあとに to を付けない（× can to swim）。2つの助動詞を並べない（× will can → ○ will be able to）。"],
 [["Can you speak Japanese?",'日本語を話せる？'],["I couldn't sleep last night.",'昨夜は眠れなかった。'],["Could you help me?",'手伝っていただけますか？']],
 [Q('I hope I\'ll ___ come.',['can','be able to','could'],1,'will のあとは be able to。'),Q('もっとていねいなお願いは？',['Can you open the door?','Could you open the door?','You open the door.'],1,'Could you ~? のほうがていねい。')]);
G('24','gr:haveto',1,'have to と must',
 ["【意味】どちらも「〜しなければならない」ですが、使う場面が少し違います。have to は「ルール・状況・事情でそうする必要がある」、must は「話す人自身が必要だと強く思っている」というニュアンスです。", "【比べてみよう】I have to wear a uniform at work.（職場のルール・事実）／I must call my mom tonight.（自分がそうしようと強く思っている）。会話ではどちらの場合も have to のほうがよく使われ、迷ったら have to で問題ありません。", "【形】have to は一般動詞と同じように変わります。主語が he / she / it なら has to（She has to work late.）。会話では have to が「ハフタ」、has to が「ハスタ」のように聞こえます。", "【疑問・否定】Do I have to ~?（〜しなければいけませんか）／Does he have to ~? 否定の don't have to は「〜しなくてもいい」という意味になります（次の単元で練習します）。", "【過去と未来】must には過去形がないので、過去は had to（I had to wait for an hour.）。未来は will have to（You'll have to show your passport.）。", "【must を使う場面】掲示・規則・注意書きなど、書かれたルールでは must がよく使われます（Passengers must wear seat belts.）。また、You must try the mango shake!（絶対飲んでみて）のように、強いおすすめにも使います。", "【have got to】イギリス英語の会話では I've got to go.（もう行かなきゃ）のような have got to もよく使われます。意味は have to と同じです。"],
 [["I have to wear a uniform at work.",'仕事では制服を着なければなりません。'],["I had to wait for an hour.",'1時間待たなければならなかった。'],["Do I have to pay now?",'今払わなければいけませんか？']],
 [Q('Yesterday I ___ get up at five.',['must','had to','have to'],1,'過去は had to。'),Q('___ I have to bring my passport?',['Do','Must','Am'],0,'have to の疑問文は Do I have to ~?')]);
G('25','gr:mustnt',1,'mustn\'t と don\'t have to / don\'t need to',
 ["【大事なポイント】must と have to は肯定文では似た意味ですが、否定文にするとまったく違う意味になります。ここが一番の注意点です。", "【mustn't＝してはいけない（禁止）】You mustn't use your phone during the test.（試験中に携帯を使ってはいけない）。発音は「マスント」で、最初の t は発音しません。アメリカ英語の会話では can't や Don't ~ で禁止を表すことも多いです（You can't smoke here.）。", "【don't have to＝しなくてもいい（不要）】You don't have to bring lunch. The school provides it.（持ってこなくていい。でも持ってきても問題ない）。「必要ない」というだけで、禁止ではありません。", "【don't need to / needn't】don't need to も「〜する必要はない」で、don't have to とほぼ同じです（You don't need to wear a tie.）。イギリス英語では needn't ＋ 原形（to なし）も使います。", "【比べてみよう】You don't have to tell him.（言わなくてもいいよ・言ってもいい）／You mustn't tell him.（絶対に言っちゃだめ）。", "【過去の場合】「〜しなくてよかった」は didn't have to / didn't need to です（I didn't have to pay. It was free.）。", "【応用】needn't have ＋ 過去分詞は「（実際はしたけど）しなくてもよかった」という意味です。You needn't have brought a gift.（お土産なんてよかったのに）。お礼の場面で聞くことがあります。"],
 [["You don't have to bring anything.",'何も持ってこなくていいよ。'],["You mustn't swim here. It's dangerous.",'ここで泳いではいけません。危険です。']],
 [Q('It\'s Sunday. I ___ go to school.',['mustn\'t','don\'t have to','must'],1,'「行かなくてもいい」は don\'t have to。'),Q('You ___ touch that. It\'s hot!',['don\'t have to','mustn\'t','needn\'t'],1,'禁止は mustn\'t。')]);
G('26','gr:should',1,'should',
 ["【意味】should ＋ 動詞の原形で「〜したほうがいい」「〜するべきだ」。アドバイスや、正しいと思うことを伝えるときに使います。You look tired. You should get some rest.", "【強さ】should は must / have to より弱く、「〜したほうがいいと思う」くらいの気持ちです。You should apologize.（謝ったほうがいい）／You must apologize.（謝らなければだめ）。", "【やわらかく言う】I think you should ~ / I don't think you should ~ の形にすると、押しつけない言い方になります。「〜しないほうがいいと思う」は I think you shouldn't ~ より I don't think you should ~ のほうが自然です。", "【相談する】Should I ~?（〜したほうがいいかな？）／What should I do?（どうしたらいい？）。Do you think I should ~? もよく使います。", "【当然そうなるはず】「（本来なら）〜のはずだ」という予想にも使います。The bus should be here soon.（もうすぐ来るはず）／She studied hard, so she should pass.", "【should have ＋ 過去分詞】「〜すればよかった（のにしなかった）」という後悔や指摘です。I should have brought an umbrella.（傘を持ってくればよかった）。shouldn't have ＋ 過去分詞は「〜しなければよかった」（I shouldn't have eaten so much.）。", "【似た表現】ought to も should とほぼ同じ意味ですが、会話では should のほうがずっとよく使われます。had better は「〜しないと困ったことになる」と、should より強い言い方です（別の単元で扱います）。"],
 [["You should try the mango shake.",'マンゴーシェイクを飲んでみるといいよ。'],["You shouldn't walk alone at night.",'夜はひとりで歩かないほうがいい。'],["What should I do?",'どうしたらいい？']],
 [Q('You look tired. You ___ go to bed early.',['should','shouldn\'t','mustn\'t'],0,'助言は should。'),Q('「相談」: ___ I take a taxi?',['Should','Do','Must'],0,'「〜すべき？」は Should I ~?')]);
G('29','gr:request',1,'お願い・申し出・許可・誘い',
 ["【お願いする】Can you ~? / Could you ~?（〜してもらえますか）。Could のほうがていねいです。さらにていねいにするなら Do you think you could ~? / Would you mind ~ing?（〜していただけませんか）。Would you mind opening the window?", "【Would you mind の答え方】mind は「いやだと思う」という意味なので、引き受けるときは No, not at all. / Of course not.（いいえ、かまいませんよ）と否定で答えます。Sure. も会話ではよく使われます。", "【物をもらう・注文する】Can I have ~? / Could I have ~?（〜をもらえますか）。お店やレストランでは Can I get ~? もよく聞きます。I'd like ~（〜がほしいのですが）もていねいな言い方です（I'd like a room with a view, please.）。", "【許可をもらう】Can I ~? / Could I ~?（〜してもいいですか）。May I ~? はさらにかしこまった言い方です。Is it OK if I ~? / Do you mind if I ~?（〜してもかまいませんか）も便利です（Do you mind if I sit here?）。", "【申し出る】Can I help you?／Shall I ~? / Do you want me to ~?（〜しましょうか）。Let me carry that.（それ、持ちますよ）のように Let me ~ もよく使います。", "【誘う・すすめる】Would you like ~?（〜はいかがですか）／Would you like to ~?（〜しませんか）。Do you like ~? は「〜は好きですか」という意味になってしまうので注意しましょう。Do you want to ~? はカジュアルな誘い方です。", "【返事】受けるとき：Sure. / Of course. / I'd love to. / That would be great. 断るとき：I'm sorry, but I can't. / Thanks, but I'm OK. のように、お礼や理由を添えるとやわらかくなります。"],
 [["Would you mind closing the door?",'ドアを閉めていただけますか？'],["May I use the restroom?",'お手洗いをお借りしてもいいですか？'],["Would you like to join us?",'ご一緒にいかがですか？']],
 [Q('Would you mind ___ the window?',['open','to open','opening'],2,'Would you mind のあとは -ing。'),Q('いちばんていねいな許可の求め方は？',['Can I sit here?','May I sit here?','I sit here?'],1,'May I ~? がいちばんていねい。')]);
G('34','gr:passive',1,'受け身（is done / was done）',
 ["【意味】受け身は「〜される・〜された」と、動作を受ける側を主語にする言い方です。誰がしたかより、「何に何が起きたか」を伝えたいときに使います。", "【形】be動詞 ＋ 過去分詞。現在なら am / is / are ＋ 過去分詞（English is spoken here.）、過去なら was / were ＋ 過去分詞（My bag was stolen.）。過去分詞は規則動詞なら -ed、不規則動詞は stolen / made / written / built のように覚えます。", "【使う場面】① 誰がしたか分からない（My phone was stolen.）、② 誰がしたかは大事ではない・言わなくても分かる（The room is cleaned every day.）、③ 物事の説明やニュース（The hotel was built in 2010.）。", "【by ~ を付けるとき】誰がしたかをわざわざ伝えたいときだけ by ~ を付けます（This song was written by a Filipino singer.）。ほとんどの受け身の文には by ~ がありません。", "【否定・疑問】be動詞の文と同じです。否定は isn't / wasn't ＋ 過去分詞（I wasn't invited.）、疑問は be動詞を前に出します（Is breakfast included?／When was this temple built?）。", "【よく使う受け身】be born（生まれる：I was born in 1998.）、be made of / be made in（〜でできている・〜製）、be located（〜にある）、be included（含まれている）、be canceled（中止になる）、be delayed（遅れる：Our flight was delayed.）。", "【よくある間違い】be動詞を忘れない（× The room cleaned every day. → ○ The room is cleaned every day.）。過去分詞を過去形と取り違えない（× was wrote → ○ was written）。"],
 [["Breakfast is served at seven.",'朝食は7時に出されます。'],["My phone was stolen.",'携帯が盗まれました。'],["The class was canceled.",'授業が中止になった。']],
 [Q('This room ___ every day.',['cleans','is cleaned','cleaned'],1,'「掃除される」は is cleaned。'),Q('The movie ___ in 2020.',['made','was made','is made'],1,'過去の受け身は was ＋ 過去分詞。')]);
G('39','gr:question',0,'疑問文の作り方',
 ["【基本ルール】英語の疑問文は「主語の前に、be動詞・助動詞・do を出す」のが基本です。日本語のように文の最後を上げるだけ（You are hungry?）でも会話では通じますが、驚きや確認のニュアンスになります。", "【① be動詞の文】be動詞を主語の前へ。You are ready. → Are you ready?／Is the pool open today?", "【② 一般動詞の文】Do / Does / Did を主語の前に置き、動詞は原形に戻します。Do you like it? / Does your teacher live near here? / Did she call you?（× Did she called）。", "【③ 助動詞の文】can / will / should / have（現在完了）などを主語の前へ。Can you swim? / Will you be there? / Have you finished?", "【疑問詞の疑問文】疑問詞を先頭に置き、あとは①〜③の語順です。Where do you live? / What time does the class start? / How long have you been here?", "【主語を聞くとき】Who / What が「誰が・何が」と主語になるときは do / does / did を使いません。Who called you?（誰があなたに電話した？）／What happened?（何が起きた？）。比べてみましょう：Who did you call?（あなたは誰に電話した？）。", "【前置詞は最後】Where are you from? / Who are you talking to? / What are you looking for? のように、前置詞は文の最後に残すのが自然な会話の形です。", "【否定の疑問文】Aren't you tired?（疲れてないの？）／Don't you like it?（好きじゃないの？）は、驚きや「〜だよね？」という確認に使います。答えは、事実が肯定なら Yes、否定なら No です（Don't you like it? — No, I don't.＝好きじゃない）。"],
 [["Are you hungry?",'お腹すいてる？'],["Does this bus go downtown?",'このバスは中心部へ行きますか？'],["Can I pay by card?",'カードで払えますか？']],
 [Q('___ you finish your homework?',['Do','Did','Are'],1,'過去のことなので Did。'),Q('___ she speak English?',['Do','Is','Does'],2,'she ＋ 一般動詞の疑問は Does。')]);
G('40','gr:embedded',1,'文の中の疑問文（Do you know where ~?）',
 ["【意味】「〜か知っていますか」「〜か教えてもらえますか」のように、疑問文がほかの文の中に入る形です。間接疑問文とも言います。人に道や情報をたずねるとき、ていねいに聞ける便利な形です。", "【語順が変わる】文の中に入った疑問文は、ふつうの文の語順（主語 ＋ 動詞）に戻ります。Where is the station? → Do you know where the station is?（× where is the station）。", "【do / does / did は消える】What time does the shop open? → Could you tell me what time the shop opens?（× what time does the shop open）。did の場合は動詞を過去形にします（Why did he leave? → I don't know why he left.）。", "【Yes / No の質問】疑問詞がない疑問文は if または whether でつなぎます。Is he coming? → Do you know if he's coming?／I'm not sure whether it's open today.", "【よく使う入り口】Do you know ~? / Could you tell me ~? / Do you have any idea ~? / I don't know ~ / I wonder ~ / I'm not sure ~ / Can you ask him ~? 最後の記号は、入り口が質問なら「?」、ふつうの文なら「.」です。", "【旅先で使える例】Could you tell me where the restroom is? / Do you know how much a taxi to the airport costs? / I wonder what time the last ferry leaves.", "【人の質問を伝える】He asked me where I lived.（彼は私がどこに住んでいるか聞いた）のように、聞かれたことを伝えるときも同じ語順になります。"],
 [["Could you tell me where the restroom is?",'お手洗いがどこか教えていただけますか？'],["I don't know what time it starts.",'何時に始まるか分かりません。']],
 [Q('Do you know where ___?',['is the bank','the bank is','does the bank'],1,'文の中では「主語＋動詞」の語順。'),Q('Do you know ___ the shop is open?',['if','what','that'],0,'Yes/No の疑問は if。')]);
G('43','gr:ing',1,'動詞 ＋ -ing（enjoy doing）',
 ["【ルール】動詞の中には、あとに別の動詞を続けるとき -ing の形しか取らないものがあります。to ＋ 原形は使えません。× I enjoy to swim. → ○ I enjoy swimming.", "【代表的な動詞】enjoy（楽しむ）、finish（終える）、mind（いやがる）、stop（やめる）、avoid（避ける）、suggest（提案する）、recommend（すすめる）、consider（よく考える）、imagine（想像する）、practice（練習する）、miss（〜しそこなう・しなくて寂しい）、keep（〜し続ける）。", "【2語の動詞】give up（やめる）、put off（先延ばしにする）、go on / carry on（続ける）、keep on（何度も〜する）、look forward to（楽しみにする）も -ing を取ります。look forward to の to は前置詞なので、× look forward to see → ○ look forward to seeing です。", "【イメージ】-ing は「実際にしている・していたこと」と結びつきやすい形です。enjoy（していることを楽しむ）、finish / stop（していることを終える・やめる）と考えると覚えやすくなります。", "【否定】「〜しないこと」は not ＋ -ing です。I enjoy not having to wake up early on weekends.（週末に早起きしなくていいのがうれしい）。", "【Would you mind ~ing?】「〜していただけますか」というていねいなお願いです。Would you mind waiting a moment? 引き受けるときは No, not at all.（いいえ、かまいません）と答えます。", "【stop の注意】stop ＋ -ing は「〜するのをやめる」、stop ＋ to ＋ 原形は「〜するために立ち止まる」です。I stopped smoking.（たばこをやめた）／I stopped to smoke.（たばこを吸うために立ち止まった）。"],
 [["I enjoy talking with my teachers.",'先生たちと話すのが楽しいです。'],["Have you finished eating?",'食べ終わった？'],["Keep practicing!",'練習を続けて！']],
 [Q('I enjoy ___ new people.',['to meet','meeting','meet'],1,'enjoy のあとは -ing。'),Q('She gave up ___.',['to smoke','smoking','smoke'],1,'give up のあとは -ing。')]);
G('44','gr:to',1,'動詞 ＋ to（decide to）',
 ["【ルール】動詞の中には、あとに別の動詞を続けるとき to ＋ 動詞の原形を取るものがあります。× I decided going. → ○ I decided to go.", "【代表的な動詞】want（〜したい）、hope（〜したいと願う）、need（〜する必要がある）、decide（決める）、plan（計画する）、promise（約束する）、agree（同意する）、refuse（断る）、offer（申し出る）、learn（できるようになる）、try（やってみる・努力する）、manage（なんとか〜する）、afford（〜する余裕がある）、forget（〜し忘れる）。", "【イメージ】to には「これから先に向かう」イメージがあります。want / hope / plan / decide / promise など、まだしていない「これからのこと」を表す動詞が多いと考えると覚えやすくなります。", "【否定】「〜しないことにする」は not to ＋ 原形です。I decided not to go.（行かないことにした）／Try not to be late.", "【would like to】「〜したい」のていねいな言い方は would like to ＋ 原形です（I'd like to book a tour.）。want to より上品に聞こえるので、お店や電話で使いましょう。会話では want to が wanna に聞こえることがあります。", "【seem / pretend】seem to（〜のようだ）、pretend to（〜するふりをする）も to を取ります。She seems to be tired.／He pretended not to see me.", "【どちらも取る動詞】like / love / hate / start / begin / continue は -ing でも to でも、意味はほぼ同じです（I like swimming. / I like to swim.）。remember / forget / try / stop は形で意味が変わるので、「-ing と to で意味が変わる動詞」の単元で扱います。"],
 [["I need to buy a new charger.",'新しい充電器を買わないと。'],["We decided to go to Oslob.",'オスロブに行くことにした。'],["I'm learning to cook.",'料理を習っています。']],
 [Q('I hope ___ you again.',['seeing','to see','see'],1,'hope のあとは to ＋ 原形。'),Q('They decided ___ a taxi.',['taking','to take','take'],1,'decide のあとは to ＋ 原形。')]);
G('56','gr:count',1,'数えられる名詞と数えられない名詞',
 ["【考え方】英語の名詞は「1つ、2つと数えられるもの」と「数えられないもの」に分かれます。数えられるかどうかで、a / an を付けるか、複数形にするか、many と much のどちらを使うかなどが変わります。", "【数えられる名詞】形がはっきりしていて区切れるもの：a book / two books、an apple / some apples。1つのときは a / an や my / the などを必ず付けます（× I have car. → ○ I have a car.）。一般的に「〜というもの」と言うときは複数形（I like dogs.）。", "【数えられない名詞】液体・素材（water, rice, sugar, sand）、まとまりとしてとらえるもの（money, furniture, luggage / baggage）、目に見えない考え・性質（advice, information, help, music, news, work, homework, fun, luck）。a / an は付けず、複数形にもしません（× an advice / × informations）。", "【日本人がまちがえやすい語】advice（助言）、information（情報）、furniture（家具）、luggage（荷物）、homework（宿題）、news（ニュース）、equipment（機材）、traffic（交通）、weather（天気）は数えられません。× a lot of homeworks → ○ a lot of homework。", "【数えたいとき】容器や単位を使います。a glass of water / a cup of coffee / a bottle of shampoo / a piece of advice / a piece of furniture / a slice of bread / a kilo of rice / two pieces of luggage。", "【両方になる名詞】意味によってどちらにもなる名詞があります。I'd like a coffee.（コーヒー1杯）／I don't drink coffee.（飲み物としてのコーヒー）。room は「部屋」なら数えられ（two rooms）、「空間・余地」なら数えられません（There's no room in my bag.）。", "【いっしょに使う言葉】数えられる名詞には many / a few / few / a number of、数えられない名詞には much / a little / little / an amount of。a lot of / some / any はどちらにも使えます。"],
 [["Can I have some water?",'お水をもらえますか？'],["She gave me some good advice.",'彼女が良いアドバイスをくれた。'],["I have a lot of homework.",'宿題がたくさんある。']],
 [Q('I need some ___.',['informations','information','an information'],1,'information は数えられない名詞。'),Q('Can I get ___ of advice?',['a piece','an','a'],0,'advice は a piece of advice で数えます。')]);
G('58','gr:article',0,'a / an と the',
 ["【a / an の意味】「（いくつかあるうちの）ある1つの」「1つの〜」です。相手がまだ「どれのことか」分からないもの、初めて話に出てくるものに使います。I saw a dog on the beach.", "【a と an】次の語が母音の「音」で始まれば an、子音の音なら a です。つづりではなく音で決まります。an hour（h を発音しない）、an MRI、an umbrella／a university（ユ）、a uniform、a one-way ticket（ワ）。", "【the の意味】「その」「例の」。話す人と聞く人の両方が「どれのことか分かる」ものに使います。I saw a dog on the beach. The dog was really cute.（2回目は the）。", "【the を使う場面①：場面から分かる】その場で1つに決まるものには、初めてでも the を使います。Can you turn off the light?（この部屋の電気）／Where's the bathroom?（この建物のトイレ）／I'm going to the airport.（この町の空港）。", "【the を使う場面②：1つしかない】the sun / the moon / the sky / the world / the internet。最上級（the best）や the first / the same / the only にも the が付きます。", "【the を使う場面③：説明で決まる】後ろの説明で特定されるものにも the を付けます。The hotel we stayed at was very clean.（泊まったホテル）。比べてみましょう：We stayed at a cheap hotel.（安いホテルの1つ・種類）。", "【職業・種類を言う】「〜です」と職業や種類を言うときは a / an が必要です。She's a nurse.（× She's nurse.）／It's a Filipino dish.", "【何も付けない場合】一般的な話をする複数形・数えられない名詞には、ふつう冠詞を付けません。I like cats.（猫というもの）／Water is important.。the を付けると「その特定の猫たち」の意味になります。"],
 [["I have a question.",'質問があります。'],["Can you close the door?",'（その）ドアを閉めてくれる？'],["It takes an hour.",'1時間かかります。']],
 [Q('I waited for ___ hour.',['a','an','the'],1,'hour は母音の音で始まるので an。'),Q('There\'s a café near here. ___ café is very popular.',['A','An','The'],2,'2回目なので the。')]);
G('67','gr:someany',0,'some と any',
 ["【基本】some と any はどちらも「いくつかの・いくらかの」という意味で、数えられる名詞の複数形にも、数えられない名詞にも使えます（some apples / some water）。日本語に訳さないことも多い言葉です。", "【some：ふつうの文】I bought some souvenirs. / There's some rice left.", "【any：否定文】I don't have any cash.（現金をまったく持っていない）。not ~ any で「1つも・少しも〜ない」という強い否定になります。", "【any：疑問文】Do you have any questions? / Are there any good restaurants near here? 「あるかないか分からない」ときの疑問文では any を使います。", "【疑問文でも some を使うとき】すすめるとき（Would you like some tea?）や、お願いするとき（Can I have some water?／Could you give me some advice?）は、「イエス」の答えを期待しているので some を使います。", "【名詞を省略】名詞がすでに分かっているときは、some / any だけでも使えます。I made some cookies. Do you want some?／I wanted to buy a souvenir, but I didn't see any.", "【something / anything など】同じルールで something / somebody / somewhere（ふつうの文）、anything / anybody / anywhere（否定文・疑問文）を使い分けます。I didn't eat anything.／Is anybody here?", "【肯定文の any】肯定文の any は「どれでも・何でも」という意味です。You can sit anywhere.（どこに座ってもいい）／Any bus will take you downtown.（どのバスでも行ける）。"],
 [["I bought some fruit.",'果物をいくつか買った。'],["Do you have any plans?",'何か予定はある？'],["Would you like some tea?",'紅茶はいかがですか？']],
 [Q('I don\'t have ___ cash.',['some','any','a'],1,'否定文では any。'),Q('Would you like ___ cake?',['some','any','a few'],0,'すすめる疑問文では some。')]);
G('69','gr:much',1,'much / many / few / little / a lot',
 ["【数えられる名詞と使う】many（たくさんの）、a few（少しある）、few（ほとんどない）。many people / a few friends / few chances。", "【数えられない名詞と使う】much（たくさんの）、a little（少しある）、little（ほとんどない）。much time / a little money / little information。", "【どちらにも使える】a lot of / lots of（たくさんの）、plenty of（十分すぎるほど）。a lot of tourists / a lot of water。会話では a lot of がいちばん自然です。", "【much は否定文・疑問文で】much は肯定文ではあまり使わず、否定文・疑問文で使うのがふつうです。I don't have much time. / Is there much traffic? 肯定文では a lot of を使います（× I have much money. → ○ I have a lot of money.）。ただし too much / so much / as much は肯定文でも使えます（I ate too much.）。", "【many は広く使える】many は肯定・否定・疑問のどれでも使えますが、会話の肯定文では a lot of のほうが自然に聞こえることが多いです。many years / many times は決まった言い方としてよく使います。", "【a がある・ないで意味が変わる】a few / a little は「少しはある」（前向き）、few / little は「ほとんどない」（後ろ向き）です。I have a few friends here.（何人か友だちがいる）／I have few friends here.（友だちがほとんどいない）。会話では very few / very little の形がよく使われます。", "【数・量をたずねる】How many ＋ 数えられる名詞の複数形（How many students are in your class?）、How much ＋ 数えられない名詞（How much water do you drink a day?）。値段は How much is it?"],
 [["How many students are in your class?",'クラスに学生は何人いる？'],["I don't have much time.",'あまり時間がない。'],["I have a few friends here.",'ここに友達が何人かいる。']],
 [Q('How ___ money do you have?',['many','much','few'],1,'money は数えられないので much。'),Q('I speak ___ Spanish.',['a few','a little','many'],1,'言語は数えられないので a little。')]);
G('83','gr:comp',1,'比較級（cheaper / more ~ than / as ~ as）',
 ["【形①：-er】短い形容詞・副詞には -er を付けます。cheap → cheaper、fast → faster。e で終わる語は -r（large → larger）、「母音1つ＋子音1つ」は子音を重ねる（big → bigger, hot → hotter）、-y で終わる語は -ier（easy → easier, busy → busier）。", "【形②：more】長い形容詞（2音節以上の多く）や -ly の副詞には more を前に置きます。more expensive / more interesting / more slowly。× more cheaper のように、-er と more を両方使わないこと。", "【形が変わるもの】good / well → better、bad / badly → worse、far → farther / further、many / much → more、little → less。", "【than】比べる相手は than で表します。Cebu is hotter than Tokyo. / Taking a jeepney is cheaper than taking a taxi. 会話では than me のように目的語の形がふつうです（She's taller than me.）。", "【差の大きさ】比較級の前に much / a lot / far（ずっと）、a little / a bit / slightly（少し）を置けます。This one is much cheaper.／Could you speak a little more slowly?", "【as ~ as】「〜と同じくらい…」は as ＋ 原級 ＋ as（My room is as big as yours.）。否定の not as ~ as は「〜ほど…ではない」（It's not as hot as yesterday.）。twice as ~ as（〜の2倍…）という言い方もあります。", "【よく使う形】The sooner, the better.（早ければ早いほどいい）／My English is getting better and better.（どんどん良くなっている）。比較級 and 比較級で「ますます〜」を表します。"],
 [["Cebu is warmer than Tokyo.",'セブは東京より暖かい。'],["This course is more expensive than that one.",'このコースはあのコースより高い。'],["My English isn't as good as yours.",'私の英語はあなたほど上手じゃない。']],
 [Q('This bag is ___ than that one.',['cheap','cheaper','more cheap'],1,'cheap は短いので -er。'),Q('His English is ___ than mine.',['gooder','better','more good'],1,'good の比較級は better。')]);
G('84','gr:sup',1,'最上級（the cheapest / the most ~）',
 ["【意味】3つ以上の中で「いちばん〜」と言うときの形です。ふつう前に the を付けます（または my / your など）。", "【形】短い語は the ＋ -est（the cheapest, the biggest, the easiest）、長い語は the most ＋ 原級（the most beautiful, the most popular）。つづりのルールは比較級と同じです。", "【形が変わるもの】good → the best、bad → the worst、far → the farthest / the furthest、many / much → the most、little → the least。", "【範囲の言い方】場所や集団の中なら in（the tallest building in the city / the best student in the class）、数や仲間の中なら of（the youngest of the three / the best of all）。", "【one of the ~】「いちばん〜なものの1つ」は one of the ＋ 最上級 ＋ 複数名詞です。Cebu is one of the most popular places to study English.（× one of the most popular place）。", "【現在完了と一緒に】It's the best mango I've ever eaten.（今まで食べた中でいちばんおいしいマンゴー）のように、最上級 ＋ I've ever ＋ 過去分詞は感想を伝えるときに便利です。", "【the least】「いちばん〜でない」は the least ＋ 原級です（the least expensive＝いちばん安い）。", "【oldest と eldest】年齢の「いちばん上」はふつう the oldest。家族の中の長男・長女は the eldest も使います（my eldest sister）。"],
 [["This is the best restaurant in town.",'ここは町でいちばんのレストランです。'],["What's the most difficult part?",'いちばん難しいところはどこ？']],
 [Q('She is ___ student in the class.',['the tallest','tallest','the taller'],0,'最上級は the ＋ -est。'),Q('It was ___ day of my life.',['the best','the most good','the better'],0,'good の最上級は the best。')]);
G('95','gr:atonin',0,'時を表す at / on / in',
 ["【at：時刻・ある一点】at 7:00 / at noon / at midnight / at lunchtime / at sunset。時計の「針がさす一点」のイメージです。at night（夜に）、at the moment（今）、at the same time（同時に）も at です。", "【on：日付・曜日・特定の日】on Monday / on May 5th / on my birthday / on Christmas Day / on the weekend（アメリカ英語）。カレンダーの「1マス」の上に乗っているイメージです。", "【in：月・年・季節・長い期間】in July / in 2026 / in summer / in the 1990s / in the morning / in the afternoon / in the evening。時間の「幅」の中にいるイメージです。", "【朝・昼・晩の注意】in the morning（朝に）ですが、曜日が付くと on になります：on Monday morning / on Friday night。特定の日に決まると on を使う、と覚えましょう。", "【何も付けないとき】this / next / last / every / tomorrow / yesterday / today の前には前置詞を付けません。× on next Monday → ○ next Monday／× in this morning → ○ this morning。", "【in ＋ 時間の長さ】「〜後に」と未来を言うときは in を使います。The bus will come in ten minutes.（10分後に）／I'll be back in an hour. after ten minutes とは言わないのがふつうです。", "【週末】アメリカ英語は on the weekend、イギリス英語は at the weekend。フィリピンではアメリカ英語の on the weekend がよく使われます。"],
 [["I'll see you at six.",'6時に会おう。'],["The course starts on Monday.",'コースは月曜日に始まります。'],["I'm going to Australia in March.",'3月にオーストラリアへ行きます。']],
 [Q('My flight is ___ Sunday.',['at','on','in'],1,'曜日は on。'),Q('I usually study ___ the morning.',['at','on','in'],2,'in the morning。')]);
G('97','gr:place',1,'場所を表す in / at / on',
 ["【in：中・区切られた範囲】建物や部屋の中、国・町など広い範囲に使います。in the room / in my bag / in Cebu / in Japan / in the car / in the photo / in the sky。", "【at：地点・目的の場所】地図の上の「点」のように考える場所や、何かをする場所に使います。at the bus stop / at the door / at the airport / at the front desk / at school（授業を受けている）/ at work（仕事中）/ at home。", "【on：接している面・線】表面に接しているものに使います。on the table / on the wall / on the floor / on the ceiling / on my phone / on the menu / on the website / on the left / on the second floor。", "【in と at の比べ方】I'm at the mall.（モールにいる・地点として）／It's cold in the mall.（モールの中は寒い・建物の中として）。どちらも正しく、「点」として見るか「囲まれた空間」として見るかの違いです。", "【乗り物】乗用車・タクシーは in（in a taxi / get in the car）、バス・電車・飛行機・船など立って歩ける大きな乗り物は on（on the bus / on a plane / on the ferry）。バイクや自転車も on です。", "【住所】国・市は in（in Cebu City）、通りは on（on Osmeña Boulevard）、番地まで言うと at（at 25 Mango Avenue）。", "【決まった言い方】in the front / in the back（車の前の席・後ろの席）、at the top / at the bottom / at the end（上・下・端に）、on the way（途中で）、in the middle（真ん中に）。"],
 [["I'm at the airport now.",'今空港にいます。'],["My room is on the third floor.",'私の部屋は3階です。'],["She lives in Manila.",'彼女はマニラに住んでいます。']],
 [Q('Wait for me ___ the entrance.',['in','at','on'],1,'ある地点は at。'),Q('There\'s a picture ___ the wall.',['in','at','on'],2,'表面にくっついているので on。')]);
G('107','gr:thereis',0,'there is / there are（〜がある）',
 ["【意味】「（ある場所に）〜がある・いる」と、物や人が存在することを伝える言い方です。相手がまだ知らないものを、新しく話に出すときに使います。", "【形】1つ・数えられない名詞なら There is（There's）、2つ以上なら There are。There's a pharmacy near the school. / There are many cafés in IT Park. / There's some water in the fridge.", "【否定・疑問】否定は There isn't / There aren't（There aren't any taxis.）、疑問は Is there ~? / Are there ~?（Is there an ATM around here?）。答えは Yes, there is. / No, there aren't.", "【数を聞く】How many ＋ 複数名詞 ＋ are there ~?（How many students are there in your class?）。", "【過去・未来】過去は There was / There were（There was a typhoon last week.）、未来は There will be（There will be a party on Friday.）、現在完了は There has been（There's been an accident.）。", "【there is と it is の違い】there is は「〜がある」と存在を言うとき、it is はすでに話に出たものを説明するときに使います。There's a new café near my school. It's really cute.（× It's a new café near my school.）。", "【よくある間違い】be動詞の数を名詞に合わせること。× There is many people. → ○ There are many people. また、「〜がある」を全部 have で言おうとしないこと。「（ある場所に）〜がある」の基本は There is / There are です（There's a bank on the corner.）。"],
 [["Is there an ATM near here?",'この近くにATMはありますか？'],["There are 20 students in my class.",'クラスには学生が20人います。']],
 [Q('There ___ many restaurants on this street.',['is','are','be'],1,'複数なので are。'),Q('___ a pharmacy near here?',['Is there','There is','Are there'],0,'1つのものを聞くので Is there。')]);
G('73','gr:relative',1,'関係詞 who / that / which',
 ["【何をする形？】名詞のすぐ後ろに who / that / which ＋ 文を置いて、「どんな人・どんなものか」を説明する形です。日本語では説明が名詞の前に来ますが（私が買ったカバン）、英語では後ろに来ます（the bag that I bought）。", "【人を説明する：who / that】the teacher who teaches us grammar（文法を教えてくれる先生）／a friend who lives in Manila。人には which は使いません。", "【物を説明する：which / that】a restaurant that serves Korean food／the bus which goes to the airport。会話では which より that のほうがよく使われます。", "【主語になるとき】who / that / which のあとに動詞がすぐ来るときは、それが説明の主語です。The man who called me was very kind.（電話してきた男性）。この場合 who / that は省略できません。", "【目的語になるとき】who / that / which のあとに「主語 ＋ 動詞」が来るときは、省略できます。会話では省略するのがふつうです。The movie (that) we watched was great.／The teacher (who) I like the most is Teacher Ana.", "【重ねて言わない】説明の中で同じものをもう一度言わないこと。× the bag that I bought it → ○ the bag that I bought。", "【前置詞が残る形】the hotel we stayed at（私たちが泊まったホテル）／the person I talked to のように、前置詞が最後に残る形も会話でよく使います。場所なら where も使えます（the hotel where we stayed）。"],
 [["I have a friend who lives in Sydney.",'シドニーに住んでいる友達がいます。'],["This is the book that I told you about.",'これが前に話した本です。']],
 [Q('The woman ___ works at the front desk is kind.',['which','who','where'],1,'人なので who。'),Q('Is this the bus ___ goes to the airport?',['who','that','what'],1,'物なので that（または which）。')]);
G('31','gr:if2',2,'今の「もしも」（if I knew / I wish I knew）',
 ["【意味】「今の事実とは違うこと」「ありえない・可能性が低いこと」を想像して話すときの形です。仮定法過去とも呼ばれます。", "【形】If ＋ 主語 ＋ 過去形 ~, 主語 ＋ would ＋ 動詞の原形。If I had more money, I would travel around the world.（実際はお金がない）。would のかわりに could（〜できるのに）や might（〜かもしれない）も使えます。", "【過去形でも今の話】形は過去形ですが、意味は「今」です。「現実から一歩離れている」ことを、時間を一歩前にずらして表していると考えると分かりやすいです。", "【普通の if との違い】If I have time, I'll help you.（時間があるかもしれない・現実的）／If I had time, I'd help you.（実際は時間がない）。話す人が「ありそう」と思っているかどうかで形が変わります。", "【were】be動詞は主語が I / he / she でも were を使うのが正式です（If I were you, I'd take the job.／あなたの立場なら〜するよ＝アドバイス）。会話では was も使われます。", "【I wish ＋ 過去形】「〜だったらいいのに（実際は違う）」は I wish ＋ 過去形です。I wish I could speak English fluently.／I wish it weren't so hot.", "【よくある間違い】if の部分に would を入れないこと。× If I would have time → ○ If I had time。would は結果の部分だけに使います。"],
 [["If I were rich, I would buy a house in Cebu.",'お金持ちだったら、セブに家を買うのに。'],["I wish I could speak English fluently.",'英語をすらすら話せたらいいのに。']],
 [Q('If I ___ his number, I would call him.',['know','knew','will know'],1,'今の事実と違う想像は過去形。'),Q('If I ___ you, I would ask the teacher.',['am','were','will be'],1,'If I were you が決まった形。')]);
G('114','gr:domake',1,'do と make',

function trialLeft(){ if(!S.trialStart) return TRIAL_DAYS; return TRIAL_DAYS - Math.floor((Date.now()-new Date(S.trialStart+'T00:00:00').getTime())/86400000); }
function tier(){ if(S.tier==='counseled' && trialLeft()<=0) return 'general'; return S.tier||'general'; }
const expired = ()=>S.tier==='counseled' && trialLeft()<=0;
function allowed(x){
  const t=tier(); if(t==='customer') return true;
  if(t==='general'){ if(x.lines) return x.id==='dl:class'; return x.cat==='word' && x.lv===0; }
  if(String(x.id).startsWith('iv:')) return true;
  if(x.steps) return x.id==='sim:walkin';
  if(x.quiz) return x.id==='gr:be';
  if(x.lines) return STUDY_SCENES.includes(x.scene) ? x.scene==='授業中' : x.lv<=1;
  if(x.cat==='study') return x.scene==='授業中';
  if(x.cat==='wh') return false;
  return x.lv<=1;
}
function feature(f){

function growthHTML(){

  const ser = LQ_SERIES==='all' ? dates.map(d=>({d,v:lqOverall(d)})) : dates.map(d=>{const h=lqLatest(d)[LQ_SERIES];return h?{d,v:h.lv}:null}).filter(Boolean);

  const W=380,Hh=230,L=72,R=22,T=18,B=30, n=Math.max(dates.length,1);
  const x=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)), y=v=>T+(4-v)*(Hh-T-B)/4;
  const xi=d=>dates.indexOf(d);
  const step=Math.ceil(n/5);
  const grid=LV.map((l,i)=>`<line x1="${L}" x2="${W-R}" y1="${y(i)}" y2="${y(i)}" class="g-grid"/><text x="${L-10}" y="${y(i)+4}" text-anchor="end" class="g-axis">${l} ${LV_CEFR[i]}</text>`).join('');
  const xl=dates.map((d,i)=>i%step===0||i===n-1?`<text x="${x(i)}" y="${Hh-10}" text-anchor="middle" class="g-axis">${fmtD(d)}</text>`:'').join('');
  const pts=ser.map(s=>[x(xi(s.d)),y(s.v),s]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1], first=pts[0];
  const lab=v=>{const r=Math.round(v);return `${LV[r]} ${LV_CEFR[r]}`};
  const diff = ser.length>1 ? ser[ser.length-1].v-ser[0].v : 0;
  return `<div class="panel">
   <div class="chips sub" role="group" aria-label="グラフに出すもの">${[['all','総合'],...LQ_CATS.map(c=>[c.cat,c.name])].map(([k,n])=>`<button class="chip ${LQ_SERIES===k?'on':''}" data-act="lqser" data-k="${k}" aria-pressed="${LQ_SERIES===k}">${n}</button>`).join('')}</div>
   <p class="small" style="margin:10px 0 0"><b>${esc(name)}</b>${ser.length>1?`　${fmtD(ser[0].d)}から ${diff>0?`<b class="up">${diff.toFixed(diff%1?1:0)}段階アップ</b>`:diff<0?'少し下がりました':'変わらず'}`:''}</p>
   <div style="overflow-x:auto"><svg class="growth" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(name)}のレベルの推移">

function catStats(k){

const NOUN = {word:'単語',phrasal:'句動詞',colloc:'コロケーション',idiom:'イディオム',pattern:'構文',starter:'フレーズ',dialog:'フレーズ',grammar:'単元',study:'表現',wh:'項目',known:'項目',unknown:'項目',fav:'項目'};
function navList(){
  const list=listFor();
  if(R.cat==='study') return ['授業中','学校生活','寮・生活'].flatMap(s=>DIALOGS.filter(d=>d.scene===s).concat(list.filter(x=>x.scene===s)));
  return list;
}
function stepTo(dir){ const L=navList(), i=L.findIndex(x=>x.id===R.sel), j=i+dir; if(i<0||j<0||j>=L.length) return false;
  R.sel=L[j].id; PRON={id:null,url:null,rec:null,result:''}; try{speechSynthesis.cancel();}catch(e){} JA_PLAY=null; rerender();
  const d=document.querySelector('.detail'); if(d){ d.classList.add(dir>0?'in-next':'in-prev'); if(window.innerWidth<960){ const top=document.querySelector('.seltop'), y=top?top.getBoundingClientRect().top:0; if(y<60) window.scrollTo(0, Math.max(0, window.scrollY+y-70)); } }
  return true; }
function swipeWrap(sel){
  const L=navList(), i=L.findIndex(x=>x.id===sel.id), n=NOUN[R.cat]||'項目';
  const nm=x=>x?esc(x.title||x.en||x.q||''):'';

  const nudge = (!window._swNudged && i>=0 && i<L.length-1) ? (window._swNudged=true, ' nudge') : '';
  return `<div class="swipe-wrap${nudge}">${detail(sel)}${i<0?'':h('prev',i>0,'‹','前の'+n,L[i-1])+h('next',i<L.length-1,'›','次の'+n,L[i+1])}</div>`;

function miniNav(id){

function stepNav(id){

async function toggleRec(){
  if(PRON.rec){ PRON.rec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream), chunks=[];
    mr.ondataavailable = e=>chunks.push(e.data);
    mr.onstop = ()=>{ stream.getTracks().forEach(t=>t.stop()); if(PRON.url) URL.revokeObjectURL(PRON.url); PRON.url = URL.createObjectURL(new Blob(chunks,{type:mr.mimeType})); PRON.rec=null; rerender(); };
    mr.start(); PRON.rec = mr; PRON.result=''; rerender();
  }catch(e){ PRON.result='マイクが使えませんでした。ブラウザのマイクの許可を確認してください。'; rerender(); }
}
function judge(target){
  try{
    const r = new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3;
    PRON.result='聞いています。お手本を読んでください…'; rerender();
    r.onresult = e=>{
      const norm = s=>s.toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
      const heard = Array.from(e.results[0]).map(a=>a.transcript);
      const ok = heard.some(h=>norm(h)===norm(target.replace(/~|\.\.\./g,'')));
      PRON.result = ok ? `うまく言えました！（聞き取れた英語: ${heard[0]}）` : `聞き取れた英語: 「${heard[0]}」。お手本と聞き比べて、もう一度どうぞ。`;
      rerender();
    };
    r.onerror = ()=>{ PRON.result='うまく聞き取れませんでした。静かな場所で、もう一度どうぞ。'; rerender(); };
    r.start();
  }catch(e){ PRON.result='この端末では判定ができません。'; rerender(); }
}

const TSRC = {study:'留学で使う英語',word:'単語',phrasal:'句動詞（熟語）',colloc:'コロケーション',idiom:'イディオム',pattern:'構文',starter:'文頭フレーズ',scene:'場面別フレーズ',wh:'ワーホリ対策',vault:'保存庫',known:'記憶',unknown:'未記憶',fav:'お気に入り'};
function pool(src,lv){
  if(src==='vault') return feature('vault') ? S.vault.filter(v=>v.en&&v.ja).map(v=>({id:'v:'+v.id,en:v.en,ja:v.ja})) : [];
  let xs;
  if(src==='unknown') xs = allItems().filter(x=>P(x.id).state==='unknown');
  else if(src==='known') xs = allItems().filter(x=>P(x.id).state==='known');
  else if(src==='fav') xs = allItems().filter(x=>P(x.id).fav);
  else xs = ITEMS.filter(x=>x.cat===src && (lv==='all'||x.lv===+lv));
  return xs.filter(allowed);
}

const BLANK_WORDS = [['make','do','take','have','get','give','reach','catch','keep','pay'],['heavy','strong','big','hard','high','deep','fast','strict']];
function blankQ(x){
  const w=x.en.split(' '), a=w[0], group=BLANK_WORDS.find(g=>g.includes(a.toLowerCase()))||BLANK_WORDS[0];
  const opts=[a].concat(shuffle(group.filter(g=>g!==a.toLowerCase())).slice(0,3));
  return {it:x, stem:'___ '+w.slice(1).join(' '), opts:shuffle(opts).map(o=>({id:o===a?x.id:'d:'+o, en:o, ja:o}))};
}
function startTest(){
  const blank = T.setup.dir==='blank';
  const p = shuffle(pool(T.setup.src,T.setup.lv).filter(x=>!blank || x.en.trim().includes(' '))).slice(0,10);
  if(p.length<2){ alert('この範囲で出せる問題が足りません（2問以上必要です）。範囲を変えてください。'); return; }
  if(blank){ T.qs=p.map(blankQ); T.i=0; T.score=0; T.pick=null; S.tests++; save(); return; }
  const others = allItems().filter(allowed).concat(S.vault.filter(v=>v.en&&v.ja).map(v=>({id:'v:'+v.id,en:v.en,ja:v.ja})));
  const key = T.setup.dir==='ja2en'?'en':'ja';
  T.qs = p.map(x=>({it:x,opts:shuffle([x].concat(shuffle(others.filter(o=>o.id!==x.id && o[key]!==x[key])).slice(0,3)))}));
  T.i=0; T.score=0; T.pick=null; S.tests++; save();
}
function tpick(i){
  const q=T.qs[T.i]; if(T.pick!==null) return; T.pick=i; const ok = q.opts[i].id===q.it.id; if(ok) T.score++;
  if(q.it.id.startsWith('v:')){ const v=S.vault.find(x=>'v:'+x.id===q.it.id); if(v){ Object.assign(v,review(v,ok)); save(); } } else mark(q.it.id,ok);
  rerender();
}

function talkStart(id){ if(!feature('talk') || (tier()==='counseled' && S.talkTrialUsed)){ TALK={id:null,msgs:[],step:0,done:false}; go('talk'); return; } const t=TALKS.find(x=>x.id===id); TALK={id,msgs:[{ai:true,t:t.lines[0]}],step:1,done:false}; R.v='talk'; render(); say(t.lines[0]); }
function talkSend(text){
  const t=TALKS.find(x=>x.id===TALK.id); if(!text.trim()) return;
  TALK.msgs.push({t:text.trim()});
  if(TALK.step<t.lines.length){ const line=t.lines[TALK.step++]; TALK.msgs.push({ai:true,t:line}); setTimeout(()=>say(line),150); }
  if(TALK.step>=t.lines.length){ TALK.done=true; S.talkLog++; if(tier()==='counseled') S.talkTrialUsed=true; save(); }
  rerender();
}

      ${exp.length?`${H('bag','Experience')}<div class="cv-tl">${exp.map(x=>`<div class="cv-item"><div class="cv-row"><b>${esc(x.role)}${x.length?` <span class="cv-len">・・・ ${esc(x.length)}</span>`:''}</b><span class="cv-yr">${esc(x.years)}</span></div>${x.company||x.place?`<div class="cv-org">${esc(x.company)}${x.place?` @${esc(x.place)}`:''}</div>`:''}${x.desc?`<p>${esc(x.desc)}</p>`:''}</div>`).join('')}</div>`:''}
      ${refs.length||r.refsOnRequest?`${H('book','References')}${refs.length?`<div class="cv-refs">${refs.map(x=>`<div><b>${esc(x.name)}</b><div class="cv-org2">${esc(x.org)}${x.org&&x.position?' / ':''}${esc(x.position)}</div>${x.phone?`<small>Phone: ${esc(x.phone)}</small>`:''}${x.email?`<small>Email: ${esc(x.email)}</small>`:''}</div>`).join('')}</div>`:`<p class="cv-req">Available upon request.</p>`}`:''}
    </main></section>`;
  const p2=certs.length?`<section class="cv-page cv-p2"><div class="cv-deco"></div><div class="cv-p2in">${H('award','Achievements &amp; Certificates')}
    <div class="cv-certs">${certs.map(c=>`<figure>${c.img?`<img src="${c.img}" alt="">`:`<div class="cv-ph">画像</div>`}${c.cap?`<figcaption>${esc(c.cap)}</figcaption>`:''}</figure>`).join('')}</div></div></section>`:'';

function fitCV(){ document.querySelectorAll('.cv-fit').forEach(w=>{ const cv=w.querySelector('.cv'); if(!cv) return; const s=Math.min(1,w.clientWidth/794); cv.style.transform=`scale(${s})`; w.style.height=(cv.scrollHeight*s)+'px'; }); }
window.addEventListener('resize',()=>fitCV());
document.addEventListener('load',e=>{ if(e.target.closest && e.target.closest('.cv')) fitCV(); },true);
function cvImage(file,maxW,cb){
  const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,maxW/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',0.82)); }; im.src=rd.result; }; rd.readAsDataURL(file);
}

V.guide = ()=>`<h1>手引書</h1>

    <ul class="small" style="margin:0;padding-left:1.2em">
     <li>フィリピンの英語は、アメリカ英語の影響を強く受けています。留学先の先生の発音に近いので、授業がそのまま聞き取りやすくなります。</li>
     <li>日本の中学・高校の英語の教科書は、アメリカ英語が中心です。これまでの学習とつながります。</li>
     <li>基準を1つに決めると、発音記号と音声が食い違わず、迷わずに練習できます。</li>

    <p class="muted small" style="margin:6px 0 0">イギリス英語やオーストラリア英語が間違いというわけではありません。ワーホリなどで使う言い方の違いは、必要なところで短く紹介しています。</p></div>

     <tr><th scope="row">例</th><td><span class="en">give up</span>（あきらめる）<br><span class="en">put off</span>（延期する）</td><td><span class="en">make a mistake</span>（間違える）<br><span class="en">heavy rain</span>（大雨）</td></tr>

     <tr><th scope="row">テスト</th><td>意味を選ぶ（日本語 ⇄ 英語）</td><td>穴埋め（<span class="en">___ a mistake</span> → make / do / take）</td></tr>
    </tbody></table></div>
  <div class="muted small stack" style="margin-top:8px">
    <p>日本語の「熟語」は意味が広く、イディオムなども含みます。このアプリの「句動詞（熟語）」は、動詞と短い語の組み合わせだけを集めています。</p>

  </div>`;

const PRON_UNITS = {
 'pu:rl':{one:'r は舌をどこにも付けない。l は舌先を上の歯ぐきに付ける。',
  sym:[{s:'/r/',how:'唇を少し丸め、舌先を口の中で浮かせたまま、少し奥に引く。舌はどこにも付けない。',ex:['right','rice','very']},
       {s:'/l/',how:'舌先を、上の前歯の裏の歯ぐきにしっかり付けて声を出す。息は舌の両脇から出る。',ex:['light','lice','hello']}],
  rule:'日本語の「ら行」は、舌先で歯ぐきを軽くはじく音で、r とも l とも違います。r は「付けない」、l は「付ける」と覚えると区別できます。school や feel のように最後に来る l は、舌を付けたまま「ウ」に近く聞こえます。',
  pairs:[['right','light'],['rice','lice'],['read','lead'],['correct','collect'],['fry','fly']],
  practice:['I really like rice.','Let me read the lesson.','The light is on the right.']},
 'pu:th':{one:'舌先を上の前歯に軽く当てて、息（/θ/）や声（/ð/）を出す。',
  sym:[{s:'/θ/',how:'舌先を上の前歯の先に軽く当て（歯で軽くはさんでもよい）、すき間から息だけを出す。声は出さない。',ex:['think','three','bath']},
       {s:'/ð/',how:'口の形は /θ/ と同じ。今度は声を出す。',ex:['this','they','mother']}],
  rule:'th は日本語にない音です。「さ行」「ざ行」で代わりに言うと、think が sink（沈む）、thank が sank に聞こえてしまいます。舌を前歯に当てることが、いちばんのコツです。',
  pairs:[['think','sink'],['thank','sank'],['three','tree'],['they','day'],['mouth','mouse']],
  practice:['Thank you for this.','I think there are three.','My brother is over there.']},
 'pu:link':{one:'子音で終わる単語の次が母音で始まると、2つがつながって1語のように聞こえる。',
  sym:[{s:'an apple',how:'n が次の a につながる。/ə ˈnæpəl/。目安は「アナポー」。',ex:['an apple']},
       {s:'check it out',how:'k と t が次の母音につながる。t はラ行に近くなる。目安は「チェキラウ」。',ex:['check it out']},
       {s:'pick it up',how:'k と t がつながる。最後の p はほとんど聞こえない。目安は「ピキラッ」。',ex:['pick it up']}],
  rule:'英語は単語ごとに区切らず、つなげて話します。聞き取れない原因の多くは、このつながりです。前の単語の最後の子音を、次の単語の頭に移すつもりで読むと、自然に聞こえます。',
  pairs:[],
  practice:['Can I have a look at it?','Pick it up, please.','Not at all.']}
};
