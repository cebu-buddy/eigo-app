<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ココマンゴー英語 ベータ版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F8F7; --surface:#FFFFFF; --ink:#3D2613; --muted:#6E5A4B; --line:#D5E6E3;
  --teal:#49B0A8; --teal-ink:#2C7A73; --mint:#E7F4F3; --mint2:#CFE8E5;
  --mango:#F5A524; --mango-soft:#FDF0D5; --pink:#E76874; --ok:#2E8B57; --ng:#C8455A; --hl:#FCE7B2;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --en:"Lexend","Helvetica Neue",Arial,sans-serif;
  --ipa:"Charis SIL","Doulos SIL","Lucida Grande","Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12201E; --surface:#1A2C29; --ink:#F1EBE4; --muted:#B9AA9C; --line:#2E4642;
    --teal:#5CC2B9; --teal-ink:#7FD6CD; --mint:#1F3632; --mint2:#2A4743;
    --mango:#F7B548; --mango-soft:#3A3020; --pink:#F08791; --ok:#5CC48A; --ng:#F08A9B; --hl:#5A4718;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12201E; --surface:#1A2C29; --ink:#F1EBE4; --muted:#B9AA9C; --line:#2E4642;
  --teal:#5CC2B9; --teal-ink:#7FD6CD; --mint:#1F3632; --mint2:#2A4743;
  --mango:#F7B548; --mango-soft:#3A3020; --pink:#F08791; --ok:#5CC48A; --ng:#F08A9B; --hl:#5A4718;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:16px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.app{min-height:100vh;padding-bottom:84px}
.side{display:none}
.produced{font-size:12px;color:var(--muted);margin:10px 0 0;letter-spacing:.02em}
.produced a{color:var(--teal-ink);font-weight:700;text-decoration:none}.produced a:hover{text-decoration:underline}
.produced.center{text-align:center;margin-top:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--teal-ink);text-decoration:none;background:none;border:0;padding:0;cursor:pointer}
.brand small{font-weight:500;color:var(--muted);font-size:11px;display:block;line-height:1.2}
.top-links{display:flex;gap:4px;flex:none}
.top .brand{min-width:0}.top .brand>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.icon-btn{white-space:nowrap}
@media (max-width:380px){
  .top{padding:10px 12px;gap:6px}
  .top .brand{font-size:15px;gap:6px}.top .brand svg{width:28px;height:28px}
  .top .brand small{font-size:10px}
  .icon-btn{padding:5px 9px;font-size:12px}
}
@media (max-width:345px){
  .top{padding:10px 10px}.top .brand{font-size:14px;gap:5px}.top .brand svg{width:24px;height:24px}
  .icon-btn{padding:4px 7px;font-size:11.5px}.top-links{gap:3px}
}
.icon-btn{border:0;background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;border:1px solid var(--line)}
main{padding:4px 16px 24px;max-width:1080px;margin:0 auto}
.app.is-welcome{display:block!important;padding-bottom:24px}
.welcome-main{max-width:560px;width:100%}
@media (min-width:960px){.welcome-main{padding-top:4vh}}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;padding:4px 0;border-radius:12px;cursor:pointer;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button.on{color:var(--teal-ink);font-weight:700}
.tabbar button.ask{color:var(--ink)}
.tabbar button.ask .bubble{background:var(--mango);border-radius:14px;padding:4px 12px;margin-top:-14px;box-shadow:0 2px 0 rgba(61,38,19,.18)}
.tabbar button.ask.on .bubble{background:var(--teal);color:#fff}

@media (min-width: 960px){
  .app{display:grid;grid-template-columns:236px 1fr;padding-bottom:0}
  .tabbar,.top{display:none}
  .side{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
  .side .brand{margin:0 6px 18px}
  .side button.nav{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:9px 12px;border-radius:12px;cursor:pointer;color:var(--ink)}
  .side button.nav svg{width:20px;height:20px;flex:none}
  .side button.nav:hover{background:var(--mint)}
  .side button.nav.on{background:var(--mint2);font-weight:700;color:var(--teal-ink)}
  .side .grp{font-size:12px;color:var(--muted);margin:14px 12px 4px}
  .side .ask-cta{margin-top:auto;background:var(--mango);border:0;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.4;cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;color:#2B140B}
  .side .ask-cta svg{width:20px;height:20px;flex:none}
  .side .side-pb{margin:12px 6px 0;font-size:11px}
  main{padding:28px 36px 48px}
}

h1{font-size:24px;line-height:1.35;margin:8px 0 14px}
h2{font-size:18px;margin:22px 0 10px}
h3{font-size:16px;margin:0 0 6px}
p{margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack>*+*{margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 16px;cursor:pointer}
.btn.primary{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff;font-weight:700}
.btn.cta{background:var(--pink);border-color:var(--pink);color:#2B140B;font-weight:700}
.btn.mango{background:var(--mango);border-color:var(--mango);color:#2B140B;font-weight:700}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:10px}
.btn.on{background:var(--mint2);border-color:var(--teal);color:var(--teal-ink);font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin;position:relative}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px;white-space:nowrap}
.chip.on{background:var(--teal-ink);border-color:var(--teal-ink);color:#fff;font-weight:700}

.ja-audio{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:4px 0 10px}
.stepnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.stepnav .btn{flex:1;max-width:220px;white-space:nowrap;padding:9px 8px;font-size:clamp(11px,3.3vw,15px);letter-spacing:-.02em}
.stepnav>span{white-space:nowrap}
.gsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gsel select{flex:1 1 100%;min-width:0;max-width:460px;font-size:16px;font-weight:600;color:var(--ink);border:1.5px solid var(--teal);background:var(--surface);appearance:none;-webkit-appearance:none;padding-right:36px;background-image:linear-gradient(45deg,transparent 50%,var(--teal-ink) 50%),linear-gradient(135deg,var(--teal-ink) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.gsel .chip{flex:none}
.swipe-wrap{position:relative;touch-action:pan-y;overflow-x:clip}
.swipe-wrap .detail{will-change:transform}
.sw-hint{position:absolute;top:12px;z-index:2;display:none;flex-direction:column;gap:2px;max-width:46%;color:var(--teal-ink);opacity:0;pointer-events:none}
.sw-hint.prev{left:6px;align-items:flex-start;text-align:left}.sw-hint.next{right:6px;align-items:flex-end;text-align:right}
.sw-hint span{font-size:22px;line-height:1;font-family:var(--en);font-weight:600}
.sw-hint small{font-size:11px;color:var(--muted);white-space:nowrap}
.sw-hint small b{display:block;font-family:var(--en);font-size:15px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.sw-hint.off{display:none!important}
@media (max-width:959px){.sw-hint{display:flex}}
.seltop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.seltop .back{margin-bottom:0!important}
.mininav{display:none;align-items:center;gap:2px;margin-left:auto}
.mininav button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--teal-ink);font-size:20px;line-height:1;font-family:var(--en);cursor:pointer;opacity:.75}
.mininav button:disabled{opacity:.25;cursor:default}
.mininav span{font-size:12px;color:var(--muted);min-width:44px;text-align:center;font-family:var(--en)}
@media (max-width:959px){.split.has-sel .mininav{display:flex}}
@media (min-width:960px){.seltop{display:none}}
.swipe-wrap.nudge .detail{animation:nudge 1.2s .6s cubic-bezier(.45,0,.25,1)}
@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-22px)}55%{transform:translateX(0)}72%{transform:translateX(-7px)}86%{transform:none}}
.detail.in-next{animation:inNext .34s cubic-bezier(.16,1,.3,1)}.detail.in-prev{animation:inPrev .34s cubic-bezier(.16,1,.3,1)}
@keyframes inNext{from{opacity:.2;transform:translateX(38%)}to{opacity:1;transform:none}}
@keyframes inPrev{from{opacity:.2;transform:translateX(-38%)}to{opacity:1;transform:none}}
.ipa-big{font-family:var(--ipa);font-size:30px}
.lq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:14px 0 8px}
.lq-cell{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.lq-name{font-size:13px;color:var(--muted)}
.lq-lv{font-weight:700;color:var(--teal-ink)}
.lq-bar{display:flex;gap:3px}.lq-bar i{width:18px;height:6px;border-radius:3px;background:var(--line)}.lq-bar i.on{background:var(--teal)}
svg.growth{width:100%;max-width:640px;height:auto;margin-top:6px;display:block}
.g-grid{stroke:var(--line);stroke-width:1}
.g-axis{fill:var(--muted);font-size:11.5px;font-family:var(--jp)}
.g-line{fill:none;stroke:var(--teal-ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.g-dot{fill:var(--teal-ink);stroke:var(--surface);stroke-width:2}
.g-val{fill:var(--ink);font-size:12.5px;font-weight:700;font-family:var(--jp)}
.up{color:var(--ok)}
.cat-gl{font-size:12px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.catgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:700px){.catgrid{grid-template-columns:repeat(4,1fr)}}
.catwrap{position:relative;display:flex}.catwrap>.catcard{flex:1;padding-right:36px}
.catinfo{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:transparent;color:var(--teal-ink);border-radius:50%;cursor:pointer;padding:0;flex:none;vertical-align:middle}
.catinfo svg{width:20px;height:20px}.catinfo:hover{background:var(--mint)}
.catwrap>.catinfo{position:absolute;top:4px;right:4px;opacity:.75}
.ci-cmp td,.ci-cmp th{font-size:13px}.ci-cmp tr.here{background:var(--mango-soft)}.ci-cmp tr.here th{font-weight:700}
.catcard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-height:78px;cursor:pointer;color:var(--ink)}
.catcard:hover{border-color:var(--teal)}
.catcard b{font-size:15px}.catcard .n{font-size:11.5px;color:var(--muted)}
.cbar{display:block;width:100%;height:5px;background:var(--mint);border-radius:9px;margin-top:auto;overflow:hidden}.cbar i{display:block;height:100%;background:var(--teal)}
.crumbrow{margin:4px 0 2px}
.cat-title{font-size:24px}
.catswitch{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
.catswitch .sw{font-size:12px;font-weight:700;border:1.5px solid var(--teal);color:var(--teal-ink);border-radius:999px;padding:2px 10px;white-space:nowrap}
dialog.sheet{position:fixed;inset:auto 0 0 0;margin:0 auto;width:100%;max-width:560px;max-height:85vh;border:0;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));background:var(--surface);color:var(--ink);box-shadow:0 -8px 30px rgba(61,38,19,.2)}
dialog.sheet[open]{animation:sheetUp .26s cubic-bezier(.16,1,.3,1)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
dialog.sheet::backdrop{background:rgba(30,40,38,.45)}
.sheet-grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheetgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sheetgrid button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px;text-align:left;font-size:14px;cursor:pointer}
.sheetgrid button.on{border:2px solid var(--teal);background:var(--mint);font-weight:700}
.learn-head{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;margin-bottom:6px}
.learn-head h1{margin:8px 0}
.mylist{display:flex;gap:6px}
.mybtn{border:1.5px solid var(--mango);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.mybtn b{font-family:var(--en);margin-left:2px}
.mybtn.on{background:var(--mango);color:#2B140B;font-weight:700}
.filter-l{font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:500}
.chips.cats .chip{border-radius:12px;padding:9px 16px;font-size:15px;font-weight:500;border-width:1.5px}
.chips.cats .chip.on{font-weight:700}
.filter{margin-top:10px;padding:10px 12px 6px;background:var(--mint);border-radius:14px}
.chips.sub .chip{font-size:13px;padding:3px 12px;background:var(--surface);border-color:transparent}
.chips.sub .chip.on{background:var(--mango-soft);border-color:var(--mango);color:var(--ink)}
.linkbtn{flex:none;border:0;background:none;color:var(--teal-ink);text-decoration:underline;font-size:13px;cursor:pointer;padding:3px 6px}
dialog.modal{width:calc(100% - 32px);max-width:680px;max-height:86vh;border:0;border-radius:20px;padding:0 18px 18px;background:var(--bg);color:var(--ink);box-shadow:0 12px 40px rgba(61,38,19,.25)}
dialog.modal::backdrop{background:rgba(30,40,38,.5)}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:16px 0 10px;z-index:1}
.phrase-card{margin:14px 0 12px;padding:14px 16px;border-radius:16px;background:var(--mint);border:1px solid var(--mint2)}
textarea.note{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--mango-soft);line-height:1.7}
.st.note{background:var(--mango-soft);color:var(--ink);border-radius:999px;padding:1px 8px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--mint);color:var(--teal-ink);vertical-align:middle}
.tag.lv{background:var(--mango-soft);color:var(--ink)}
.en{font-family:var(--en);letter-spacing:.005em}
.ipa{font-family:var(--ipa);color:var(--muted);font-size:15px}
.syn{font-size:13px;margin:-2px 0 10px;line-height:1.8}
.syn-l{display:inline-block;font-size:11px;color:var(--teal-ink);background:var(--mint);border-radius:999px;padding:0 8px;margin-right:6px}
.say{border:0;background:var(--mint);color:var(--teal-ink);border-radius:999px;width:34px;height:34px;display:inline-grid;place-items:center;cursor:pointer;flex:none;vertical-align:middle}
.say svg{width:16px;height:16px}
.btn svg{width:16px;height:16px;vertical-align:-3px}
mark{background:var(--hl);color:inherit;border-radius:4px;padding:0 3px}
input[type=text],input[type=email],textarea,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.note{background:var(--mango-soft);border-radius:12px;padding:10px 14px;font-size:13px}
.empty{text-align:center;padding:28px 12px}
.empty .chara{margin:0 auto}
.bar{height:8px;background:var(--mint2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.chara{display:block;flex:none}
.lock{display:flex;gap:14px;align-items:flex-start;border:2px dashed var(--mango)}
.lockmark{display:inline-flex;color:var(--muted)}
.lockmark svg{width:15px;height:15px}
.side .lockmark{margin-left:auto}
.tier{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
@media (min-width: 960px){#toast{bottom:32px}}
.lvtable{width:100%;border-collapse:collapse;font-size:13px}
.lvtable th,.lvtable td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
@media (min-width: 600px){.lvtable{font-size:14px}.lvtable th,.lvtable td{padding:10px 12px}}
.lvtable thead th{font-size:12px;color:var(--muted);font-weight:500}
.lvtable tbody th{color:var(--teal-ink);white-space:nowrap}
.lvsub{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.lvtable tr.ref th,.lvtable tr.ref td{color:var(--muted);border-bottom:0}
.lvtable tr.def td{font-size:13px;color:var(--muted);padding-top:0;border-bottom:1px solid var(--mint2)}
.lvtable tr:has(+ .def) th,.lvtable tr:has(+ .def) td{border-bottom:0}

.greet{display:flex;align-items:flex-end;gap:10px;margin:6px 0 18px}
.speech{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 6px;padding:12px 16px;max-width:520px}
.speech b{display:block;font-size:13px;color:var(--teal-ink)}
.hero-study{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--teal-ink);color:#fff;border-radius:22px;padding:20px;border:0;width:100%;text-align:left;cursor:pointer}
.hero-study h2{margin:0 0 4px;font-size:20px;color:#fff}
.hero-study p{margin:0;color:#DDF1EE;font-size:14px}
.hero-study .pair{display:flex;gap:2px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
@media (min-width: 960px){.home-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;text-align:left;cursor:pointer}
.tile b{display:block;font-size:15px}
.tile span{font-size:13px;color:var(--muted)}
.today{display:flex;gap:16px;align-items:center}
.today .num{font-family:var(--en);font-size:34px;font-weight:600;color:var(--teal-ink);line-height:1}

.split{display:grid;gap:14px}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;cursor:pointer;width:100%}
.li.sel{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}

const $ = s=>document.querySelector(s);
const esc = s=>String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today = ()=>new Date().toISOString().slice(0,10);
const addDays = n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const STEPS = [1,3,7,14,30];
const P = id=>S.prog[id]||{};
function setProg(id,patch){ S.prog[id]=Object.assign({},P(id),patch); save(); }
function review(obj,ok){
  if(ok){ const st=Math.min((obj.step??-1)+1,STEPS.length-1); return {state:'known',step:st,next:addDays(STEPS[st])}; }
  return {state:'unknown',step:-1,next:addDays(1)};
}
function mark(id,ok){ setProg(id,review(P(id),ok)); }

const SIM_MARK = ['×','△','○','◎'], SIM_WORD = ['避けたい','もう一歩','通じる','とても自然'];
let SIM = {id:null,i:0,picks:[]};
function simDetail(x){
  if(SIM.id!==x.id) SIM={id:x.id,i:0,picks:[]};
  const done=SIM.picks.length, end=done>=x.steps.length;
  const bub=(who,en,ja,extra='')=>`<div class="dlg-line ${who==='mango'?'right':''}">${CH[who].svg(44)}<div class="bub"><div class="who">${esc(x.roles[who])}</div><div class="row"><span class="en">${esc(en)}</span>${sayBtn(en)}</div><div class="muted small">${esc(ja)}</div>${extra}</div></div>`;
  let h='';
  x.steps.forEach((s,i)=>{ if(i>done) return;
    h+=bub('coco',s.en,s.ja);
    if(i<done){ const o=s.opts[SIM.picks[i]], best=s.opts.find(p=>p[2]===3);
      h+=bub('mango',o[0],o[1],`<p class="sim-fb g${o[2]}"><b>${SIM_MARK[o[2]]} ${SIM_WORD[o[2]]}</b>　${esc(o[3])}</p>${o[2]<3?`<p class="small" style="margin:4px 0 0">おすすめ: <span class="en">${esc(best[0])}</span> ${sayBtn(best[0])}</p>`:''}`); }
    else h+=`<p class="filter-l" style="margin:4px 0 6px">あなたの返事を選んでください</p><div class="sim-opts">${s.opts.map((o,k)=>`<button class="sim-opt" data-act="simpick" data-k="${k}"><span class="en">${esc(o[0])}</span><span class="muted small">${esc(o[1])}</span></button>`).join('')}</div>`;
  });
  const score=SIM.picks.filter((p,i)=>x.steps[i].opts[p][2]===3).length;
  return `<div class="panel detail">
    <div class="row" style="justify-content:space-between"><div><span class="tag">シミュレーション</span> <span class="tag">${esc(x.scene)}</span></div>${favBtn(x.id)}</div>
    <h2 style="margin:6px 0 4px">${esc(x.title)}</h2>
    <div class="note" style="margin-bottom:12px"><b>場面</b><br>${esc(x.setup)}</div>
    ${h}
    ${end?`<div class="sim-end"><p style="margin:0"><b>結果: ◎ ${score} / ${x.steps.length}</b></p><p class="small muted" style="margin:4px 0 8px">${score===x.steps.length?'すべて自然な返事でした。実際の場面でも、そのまま使えます。':'◎以外の返事には、おすすめの言い方を出しています。もう一度やると、身につきます。'}</p><button class="btn primary sm" data-act="simretry">もう一度</button></div>`:''}
  </div>`;
}

function trialLeft(){ if(!S.trialStart) return TRIAL_DAYS; return TRIAL_DAYS - Math.floor((Date.now()-new Date(S.trialStart+'T00:00:00').getTime())/86400000); }
function tier(){ if(S.tier==='counseled' && trialLeft()<=0) return 'general'; return S.tier||'general'; }
const expired = ()=>S.tier==='counseled' && trialLeft()<=0;
function allowed(x){
  const t=tier(); if(t==='customer') return true;
  if(t==='general'){ if(x.lines) return x.id==='dl:class'; return x.cat==='word' && x.lv===0; }
  if(String(x.id).startsWith('iv:')) return true;
  if(x.steps) return x.id==='sim:walkin';
  if(x.quiz) return x.id==='gr:be';
  if(x.lines) return STUDY_SCENES.includes(x.scene) ? x.scene==='授業中' : x.lv<=1;
  if(x.cat==='study') return x.scene==='授業中';
  if(x.cat==='wh') return false;
  return x.lv<=1;
}
function feature(f){
  const t=tier(); if(t==='customer') return true; if(t==='general') return false; return f!=='resume';

const fmtD = d=>{ const [y,m,dd]=d.split('-'); return `${+m}/${+dd}`; };
function growthHTML(){
  const H=S.lvHist||[];
  if(!H.length) return `<div class="panel empty muted">診断を受けると、ここに日付ごとの記録とグラフが出ます。${DEBUG?`<br><button class="btn sm" style="margin-top:10px" data-act="lvsample">確認用：見本の記録を入れる</button>`:''}</div>`;
  const dates=[...new Set(H.map(h=>h.d))].sort();
  const ser = LQ_SERIES==='all' ? dates.map(d=>({d,v:lqOverall(d)})) : dates.map(d=>{const h=lqLatest(d)[LQ_SERIES];return h?{d,v:h.lv}:null}).filter(Boolean);
  const name = LQ_SERIES==='all'?'総合（受けたカテゴリーの平均）':lqCat(LQ_SERIES).name;
  const W=380,Hh=230,L=72,R=22,T=18,B=30, n=Math.max(dates.length,1);
  const x=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1)), y=v=>T+(4-v)*(Hh-T-B)/4;
  const xi=d=>dates.indexOf(d);
  const step=Math.ceil(n/5);
  const grid=LV.map((l,i)=>`<line x1="${L}" x2="${W-R}" y1="${y(i)}" y2="${y(i)}" class="g-grid"/><text x="${L-10}" y="${y(i)+4}" text-anchor="end" class="g-axis">${l} ${LV_CEFR[i]}</text>`).join('');
  const xl=dates.map((d,i)=>i%step===0||i===n-1?`<text x="${x(i)}" y="${Hh-10}" text-anchor="middle" class="g-axis">${fmtD(d)}</text>`:'').join('');
  const pts=ser.map(s=>[x(xi(s.d)),y(s.v),s]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1], first=pts[0];
  const lab=v=>{const r=Math.round(v);return `${LV[r]} ${LV_CEFR[r]}`};
  const diff = ser.length>1 ? ser[ser.length-1].v-ser[0].v : 0;
  return `<div class="panel">
   <div class="chips sub" role="group" aria-label="グラフに出すもの">${[['all','総合'],...LQ_CATS.map(c=>[c.cat,c.name])].map(([k,n])=>`<button class="chip ${LQ_SERIES===k?'on':''}" data-act="lqser" data-k="${k}" aria-pressed="${LQ_SERIES===k}">${n}</button>`).join('')}</div>
   <p class="small" style="margin:10px 0 0"><b>${esc(name)}</b>${ser.length>1?`　${fmtD(ser[0].d)}から ${diff>0?`<b class="up">${diff.toFixed(diff%1?1:0)}段階アップ</b>`:diff<0?'少し下がりました':'変わらず'}`:''}</p>
   <div style="overflow-x:auto"><svg class="growth" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(name)}のレベルの推移">
    ${grid}${xl}
    ${pts.length>1?`<path d="${path}" class="g-line"/>`:''}
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" class="g-dot"><title>${p[2].d}　${lab(p[2].v)}</title></circle><circle cx="${p[0]}" cy="${p[1]}" r="14" fill="transparent"><title>${p[2].d}　${lab(p[2].v)}</title></circle>`).join('')}
    ${last?`<text x="${Math.min(last[0],W-R-4)}" y="${last[1]-12}" text-anchor="${last[0]>W-R-60?'end':'middle'}" class="g-val">${lab(last[2].v)}</text>`:''}
   </svg></div>
   <details style="margin-top:6px"><summary class="small">記録を表で見る（${H.length}件）</summary>
    <table class="lvtable" style="margin-top:6px"><thead><tr><th scope="col">実施日</th><th scope="col">カテゴリー</th><th scope="col">結果</th><th scope="col">正解</th></tr></thead>
    <tbody>${H.slice().reverse().map(h=>`<tr><td>${h.d}</td><td>${lqCat(h.cat).name}</td><td>${LV[h.lv]} <span class="en">${LV_CEFR[h.lv]}</span></td><td>${h.sc} / 5</td></tr>`).join('')}</tbody></table></details>
  </div>`;
}

async function toggleRec(){
  if(PRON.rec){ PRON.rec.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream), chunks=[];
    mr.ondataavailable = e=>chunks.push(e.data);
    mr.onstop = ()=>{ stream.getTracks().forEach(t=>t.stop()); if(PRON.url) URL.revokeObjectURL(PRON.url); PRON.url = URL.createObjectURL(new Blob(chunks,{type:mr.mimeType})); PRON.rec=null; rerender(); };
    mr.start(); PRON.rec = mr; PRON.result=''; rerender();
  }catch(e){ PRON.result='マイクが使えませんでした。ブラウザのマイクの許可を確認してください。'; rerender(); }
}
function judge(target){
  try{
    const r = new SR(); r.lang='en-US'; r.interimResults=false; r.maxAlternatives=3;
    PRON.result='聞いています。お手本を読んでください…'; rerender();
    r.onresult = e=>{
      const norm = s=>s.toLowerCase().replace(/[^a-z' ]/g,'').replace(/\s+/g,' ').trim();
      const heard = Array.from(e.results[0]).map(a=>a.transcript);
      const ok = heard.some(h=>norm(h)===norm(target.replace(/~|\.\.\./g,'')));
      PRON.result = ok ? `うまく言えました！（聞き取れた英語: ${heard[0]}）` : `聞き取れた英語: 「${heard[0]}」。お手本と聞き比べて、もう一度どうぞ。`;
      rerender();
    };

const BLANK_WORDS = [['make','do','take','have','get','give','reach','catch','keep','pay'],['heavy','strong','big','hard','high','deep','fast','strict']];
function blankQ(x){
  const w=x.en.split(' '), a=w[0], group=BLANK_WORDS.find(g=>g.includes(a.toLowerCase()))||BLANK_WORDS[0];
  const opts=[a].concat(shuffle(group.filter(g=>g!==a.toLowerCase())).slice(0,3));
  return {it:x, stem:'___ '+w.slice(1).join(' '), opts:shuffle(opts).map(o=>({id:o===a?x.id:'d:'+o, en:o, ja:o}))};
}
function startTest(){
  const blank = T.setup.dir==='blank';
  const p = shuffle(pool(T.setup.src,T.setup.lv).filter(x=>!blank || x.en.trim().includes(' '))).slice(0,10);
  if(p.length<2){ alert('この範囲で出せる問題が足りません（2問以上必要です）。範囲を変えてください。'); return; }
  if(blank){ T.qs=p.map(blankQ); T.i=0; T.score=0; T.pick=null; S.tests++; save(); return; }
  const others = allItems().filter(allowed).concat(S.vault.filter(v=>v.en&&v.ja).map(v=>({id:'v:'+v.id,en:v.en,ja:v.ja})));
  const key = T.setup.dir==='ja2en'?'en':'ja';
  T.qs = p.map(x=>({it:x,opts:shuffle([x].concat(shuffle(others.filter(o=>o.id!==x.id && o[key]!==x[key])).slice(0,3)))}));
  T.i=0; T.score=0; T.pick=null; S.tests++; save();
}
function tpick(i){
  const q=T.qs[T.i]; if(T.pick!==null) return; T.pick=i; const ok = q.opts[i].id===q.it.id; if(ok) T.score++;
  if(q.it.id.startsWith('v:')){ const v=S.vault.find(x=>'v:'+x.id===q.it.id); if(v){ Object.assign(v,review(v,ok)); save(); } } else mark(q.it.id,ok);
  rerender();
}

const cvIcon = k=>`<svg viewBox="0 0 24 24" aria-hidden="true">${CVI[k]}</svg>`;
function resumeHTML(r=cvData()){
  const [ac,dc]=cvColors(r), L=s=>String(s||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const H=(ic,txt)=>`<h4 class="cv-h">${cvIcon(ic)}${txt}</h4>`;
  const has=x=>Object.values(x).some(v=>String(v||'').trim());

      ${contact.length?`${H('phone','Contact')}<ul class="cv-contact">${contact.map(c=>`<li><svg viewBox="0 0 24 24" aria-hidden="true">${cIcon[c[0]]}</svg>${esc(c[1])}</li>`).join('')}</ul>`:''}
      ${r.about?`${H('user','About Me')}<p class="cv-about">${esc(r.about)}</p>`:''}
      ${L(r.traits).length?`${H('star','Characteristics')}<ul class="cv-list">${L(r.traits).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
      ${L(r.skills).length?`${H('tool','Skills')}<ul class="cv-list">${L(r.skills).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    </aside>
    <main class="cv-main">
      ${edu.length?`${H('cap','Education')}<div class="cv-tl">${edu.map(x=>`<div class="cv-item"><div class="cv-row"><b>${esc(x.title)}${x.major?` <span class="cv-bar">|</span> ${esc(x.major)}`:''}</b><span class="cv-yr">${esc(x.years)}</span></div>${x.school?`<div class="cv-org">${esc(x.school)}</div>`:''}${x.desc?`<p>${esc(x.desc)}</p>`:''}</div>`).join('')}</div>`:''}
      ${exp.length?`${H('bag','Experience')}<div class="cv-tl">${exp.map(x=>`<div class="cv-item"><div class="cv-row"><b>${esc(x.role)}${x.length?` <span class="cv-len">・・・ ${esc(x.length)}</span>`:''}</b><span class="cv-yr">${esc(x.years)}</span></div>${x.company||x.place?`<div class="cv-org">${esc(x.company)}${x.place?` @${esc(x.place)}`:''}</div>`:''}${x.desc?`<p>${esc(x.desc)}</p>`:''}</div>`).join('')}</div>`:''}
      ${refs.length||r.refsOnRequest?`${H('book','References')}${refs.length?`<div class="cv-refs">${refs.map(x=>`<div><b>${esc(x.name)}</b><div class="cv-org2">${esc(x.org)}${x.org&&x.position?' / ':''}${esc(x.position)}</div>${x.phone?`<small>Phone: ${esc(x.phone)}</small>`:''}${x.email?`<small>Email: ${esc(x.email)}</small>`:''}</div>`).join('')}</div>`:`<p class="cv-req">Available upon request.</p>`}`:''}
    </main></section>`;
  const p2=certs.length?`<section class="cv-page cv-p2"><div class="cv-deco"></div><div class="cv-p2in">${H('award','Achievements &amp; Certificates')}
    <div class="cv-certs">${certs.map(c=>`<figure>${c.img?`<img src="${c.img}" alt="">`:`<div class="cv-ph">画像</div>`}${c.cap?`<figcaption>${esc(c.cap)}</figcaption>`:''}</figure>`).join('')}</div></div></section>`:'';
  return `<div class="cv" id="resume-print" style="--cv-ac:${ac};--cv-dc:${dc}">${p1}${p2}</div>`;
}
function fitCV(){ document.querySelectorAll('.cv-fit').forEach(w=>{ const cv=w.querySelector('.cv'); if(!cv) return; const s=Math.min(1,w.clientWidth/794); cv.style.transform=`scale(${s})`; w.style.height=(cv.scrollHeight*s)+'px'; }); }
window.addEventListener('resize',()=>fitCV());
document.addEventListener('load',e=>{ if(e.target.closest && e.target.closest('.cv')) fitCV(); },true);
function cvImage(file,maxW,cb){
  const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{ const s=Math.min(1,maxW/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*s); c.height=Math.round(im.height*s); c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',0.82)); }; im.src=rd.result; }; rd.readAsDataURL(file);
}

  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }catch(e){ if(e && (e.name==='QuotaExceededError'||e.code===22)){ toast('保存できる容量を超えました。画像の数を減らすか、小さい画像にしてください。'); return false; } return true; } }

V.guide = ()=>`<h1>手引書</h1>
  <div class="greet" style="margin-top:0">${coco(56)}<div class="speech"><b>ココ（仮）</b>時期ごとのおすすめの使い方です。各カテゴリーの説明は下にあります。</div></div>
  <div class="home-grid">
    <div class="panel"><h3>留学前（出発の1〜3か月前）</h3><p class="small">① レベル診断 → ②「留学で使う英語」の授業中・学校生活 → ③ 自分のレベルの単語と構文 → ④ AI英会話の「授業の始まりの雑談」。</p></div>
    <div class="panel"><h3>留学中</h3><p class="small">授業で言えなかったことは、その日のうちにAIに聞いて保存庫へ。「実際に使えた！」を押して、使える表現を増やす。寮・生活の表現も役立ちます。</p></div>
    <div class="panel"><h3>ワーホリの前</h3><p class="small">ワーホリ対策の表現 → 面接対策 → AIと面接練習 → 履歴書づくり。</p></div>
  </div>
  <h2>レベルの目安</h2>
  ${lvGuideHTML()}
  <h2>このアプリの方針</h2>
  <div class="stack">
   <div class="panel"><h3>発音はアメリカ英語を基準にしています</h3>
    <p class="small" style="margin:0 0 6px">発音記号・音声・発音講座は、アメリカ英語に合わせています。理由は3つです。</p>
    <ul class="small" style="margin:0;padding-left:1.2em">
     <li>フィリピンの英語は、アメリカ英語の影響を強く受けています。留学先の先生の発音に近いので、授業がそのまま聞き取りやすくなります。</li>
     <li>日本の中学・高校の英語の教科書は、アメリカ英語が中心です。これまでの学習とつながります。</li>
     <li>基準を1つに決めると、発音記号と音声が食い違わず、迷わずに練習できます。</li>
    </ul>
    <p class="muted small" style="margin:6px 0 0">イギリス英語やオーストラリア英語が間違いというわけではありません。ワーホリなどで使う言い方の違いは、必要なところで短く紹介しています。</p></div>
   <div class="panel"><h3>C2（最上級）は、あえて入れていません</h3>
    <p class="small" style="margin:0 0 6px">学習のレベルは、入門（A1）から上級（C1）までです。C2は、レベルの目安の表に参考として載せるだけにしています。理由は3つです。</p>
    <ul class="small" style="margin:0;padding-left:1.2em">
     <li>C2は、教養のあるネイティブに近いレベルです。留学やワーホリで目指すのは、C1までで十分です。</li>
     <li>英検とTOEICには、C2に当たる級や点数がありません。目安を示せないレベルは、目標にしにくくなります。</li>
     <li>使う人の多いレベルに中身を集めた方が、一つひとつの内容を厚くできます。</li>
    </ul></div>
  </div>
  <h2>カテゴリーの説明</h2>
  <p class="muted small" style="margin:0 0 8px">「学ぶ」のカードの右上にある ⓘ を押しても、同じ説明が見られます。</p>
  <div class="list">${Object.keys(CAT_INFO).map(k=>`<div class="panel" style="padding:12px 16px"><b>${esc(CATS[k])}</b><p class="small" style="margin:2px 0 0">${esc(CAT_INFO[k].one)}</p></div>`).join('')}<div class="panel" style="padding:12px 16px"><b>保存庫</b><p class="small" style="margin:2px 0 0">言えなかった表現をためて、復習して、次に使えるようにする自分だけの場所。</p></div></div>
  <h2>句動詞とコロケーションの違い</h2>
  <p class="muted">どちらも「2語以上のまとまり」ですが、覚える目的とテストのやり方が違うので、分けています。</p>
  <div class="panel" style="padding:0;overflow-x:auto"><table class="lvtable cmp">
    <thead><tr><th scope="col"></th><th scope="col">句動詞（熟語）</th><th scope="col">コロケーション</th></tr></thead>
    <tbody>
     <tr><th scope="row">どんなもの</th><td>組み合わせると<b>別の意味</b>になる</td><td>英語ならではの<b>語呂合わせ</b>（よく一緒に使う自然な組み合わせ）</td></tr>
     <tr><th scope="row">例</th><td><span class="en">give up</span>（あきらめる）<br><span class="en">put off</span>（延期する）</td><td><span class="en">make a mistake</span>（間違える）<br><span class="en">heavy rain</span>（大雨）</td></tr>
     <tr><th scope="row">つまずく所</th><td>単語を知っていても、意味が推測できない</td><td>意味は分かるのに、組み合わせを間違える（× <span class="en">do a mistake</span>、× <span class="en">strong rain</span>）</td></tr>
     <tr><th scope="row">身につく力</th><td>聞いて分かる力</td><td>自然に話す・書く力</td></tr>
     <tr><th scope="row">テスト</th><td>意味を選ぶ（日本語 ⇄ 英語）</td><td>穴埋め（<span class="en">___ a mistake</span> → make / do / take）</td></tr>
    </tbody></table></div>
  <div class="muted small stack" style="margin-top:8px">
    <p>日本語の「熟語」は意味が広く、イディオムなども含みます。このアプリの「句動詞（熟語）」は、動詞と短い語の組み合わせだけを集めています。</p>
    <p>イディオムは、<span class="en">a piece of cake</span>（とても簡単なこと。直訳は「ケーキ1切れ」）のように、直訳では意味が通らない決まった言い回しです。</p>
    <p><span class="en">take a shower</span>（コロケーション）と <span class="en">take off</span>（句動詞・離陸する）のように、似ていても分類が違うものがあります。迷うものは監修者が決めています。</p>

document.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const d = b.dataset;
  switch(d.act){
    case 'go': if(d.v==='level' && R.v!=='level' && LQS.done) LQS={cat:null,i:0,score:0,pick:null,qs:[],done:false}; if(d.v==='pron') PU={id:null,i:0,t:0,pick:null,score:0}; if(d.v==='learn'){ go('learn',{cat:null,sel:null}); break; } go(d.v); break;
    case 'login': { const n=$('#w-name').value.trim(); if(!n){ $('#w-name').focus(); return; } S.user=n;
      const code=$('#w-code').value.trim().toUpperCase(); S.tier=CODES[code]||'general'; S.trialStart = S.tier==='counseled'?today():''; S.talkTrialUsed=false;
      if(code && !CODES[code]) toast('招待コードが見つからなかったので、一般（面談前）で始めます。');
      save(); go('home'); break; }
    case 'settier': S.tier=d.t; S.trialStart = d.t==='counseled'?today():''; S.talkTrialUsed=false; S.askCount={d:'',n:0}; save(); render(); toast(`区分を「${TIER_NAME[d.t]}」にしました。`); break;
    case 'expire': S.tier='counseled'; S.trialStart=addDays(-(TRIAL_DAYS+1)); save(); render(); toast('お試しを期限切れにしました（一般と同じ範囲になります）。'); break;
    case 'upsell': { const m=b.parentElement.querySelector('.upsell-msg'); if(COUNSEL_URL){ window.open(COUNSEL_URL,'_blank','noopener'); } else if(m){ m.textContent='申し込み先を準備中です。セブ島留学バディーのサイトからご相談ください。'; } break; }
    case 'code': { const c=($('#me-code')?.value||'').trim().toUpperCase(); const tt=CODES[c];
      if(!tt){ toast('招待コードが見つかりませんでした。もう一度ご確認ください。'); break; }
      S.trialStart = tt==='counseled' ? (S.tier==='counseled'&&S.trialStart ? S.trialStart : today()) : ''; S.tier=tt; S.talkTrialUsed=false; save(); render(); toast(`「${TIER_NAME[tt]}」になりました。`); break; }
    case 'logout': S.user=''; save(); render(); break;
    case 'wipe': if(confirm('この端末に保存した学習記録・保存庫・履歴書の入力を消します。元に戻せません。消しますか？')){ S=Object.assign(S0(),{user:S.user,tier:S.tier,trialStart:S.trialStart}); save(); render(); } break;
    case 'say': say(d.t); break;
    case 'learn': PRON.id=null; document.getElementById('catdlg')?.close(); document.getElementById('cidlg')?.close(); go('learn',{cat:d.cat,lv:'all',sel:null}); break;
    case 'learnmenu': PRON.id=null; go('learn',{cat:null,sel:null}); break;
    case 'catsheet': openCatSheet(); break;
    case 'catinfo': openCatInfo(d.cat); break;
    case 'ciclose': document.getElementById('cidlg')?.close(); break;
    case 'catclose': document.getElementById('catdlg')?.close(); break;
    case 'lv': R.lv=d.lv; R.sel=null; rerender(); break;
    case 'scene': R.scene=d.s; R.sel=null; rerender(); break;
    case 'whscene': R.whScene=d.s; R.sel=null; rerender(); break;
    case 'simpick': { const x=WH_SIMS.find(s=>s.id===SIM.id); if(!x) break; SIM.picks.push(+d.k);
      const o=x.steps[SIM.picks.length-1].opts[+d.k]; if(o[0]) say(o[0]);
      if(SIM.picks.length>=x.steps.length){ const sc=SIM.picks.filter((p,i)=>x.steps[i].opts[p][2]===3).length; const p=(S.prog[x.id]=S.prog[x.id]||{}); p.simBest=Math.max(p.simBest??0,sc); save(); }
      rerender(); { const n=document.querySelector('.sim-opts')||document.querySelector('.sim-end'); if(n){ const r=n.getBoundingClientRect(); if(r.bottom>window.innerHeight-20) window.scrollBy({top:r.bottom-window.innerHeight+40,behavior:'smooth'}); } } break; }
    case 'simretry': SIM={id:SIM.id,i:0,picks:[]}; rerender(); break;
    case 'lvguide': openLvGuide(); break;
    case 'sayall': { const sd=SCENE_DL[d.id]; if(sd) say(sd.lines.map(l=>plain(l[1])).join(' ')); break; }
    case 'lvclose': document.getElementById('lvdlg')?.close(); break;
    case 'gch': R.gch=d.c; R.sel=null; rerender(); break;
    case 'noteonly': R.noteOnly=!R.noteOnly; R.sel=null; rerender(); break;
    case 'step': stepTo(+d.d); break;
    case 'sel': R.sel=d.id; PRON={id:null,url:null,rec:null,result:''}; rerender(); if(window.innerWidth<960) window.scrollTo(0,0); break;
    case 'unsel': R.sel=null; rerender(); break;
    case 'fav': setProg(d.id,{fav:!P(d.id).fav}); rerender(); break;
    case 'know': mark(d.id,d.ok==='1'); rerender(); break;
    case 'tovault': { const x=ITEMS.find(i=>i.id===d.id); if(x){ addVault(x.en,x.ja,x.scene||CATS[x.cat],'item'); rerender(); } break; }
    case 'exvault': addVault(d.en,d.ja,d.scene,'item'); rerender(); break;
    case 'pron': PRON={id:d.id,url:null,rec:null,result:''}; rerender(); break;
    case 'rec': toggleRec(); break;
    case 'judge': judge(d.t); break;
    case 'gq': { GQ[d.id]=GQ[d.id]||{}; GQ[d.id][+d.q]=+d.i; rerender(); break; }
    case 'lvpick': if(LQS.pick===null){ LQS.pick=+d.i; const q=LQS.qs[LQS.i]; if(q.opts[+d.i]===q.o[0]) LQS.score++; rerender(); } break;
    case 'lvstart': lvStart(d.cat); break;
    case 'puopen': PU={id:d.id,i:0,t:Math.round(Math.random()),pick:null,score:0}; PRON={id:null,url:null,rec:null,result:''}; rerender(); window.scrollTo(0,0); break;
    case 'puclose': PU={id:null,i:0,t:0,pick:null,score:0}; rerender(); window.scrollTo(0,0); break;
    case 'puplay': { const q=PRON_UNITS[PU.id].pairs[PU.i]; say(q[PU.t]); break; }
    case 'pupick': if(PU.pick==null){ PU.pick=+d.k; if(PU.pick===PU.t) PU.score++; rerender(); } break;
    case 'punext': PU.i++; PU.pick=null; PU.t=Math.round(Math.random()); rerender(); break;
    case 'puretry': PU.i=0; PU.pick=null; PU.score=0; PU.t=Math.round(Math.random()); rerender(); break;
    case 'gaudio': grammarAudio(d.id); break;
    case 'pudone': S.pronDone=S.pronDone||{}; if(S.pronDone[d.id]) delete S.pronDone[d.id]; else S.pronDone[d.id]=true; save(); rerender(); break;
    case 'lqser': LQ_SERIES=d.k; rerender(); break;
    case 'lvsample': lvSample(); rerender(); break;
    case 'lvnext': LQS.i++; LQS.pick=null; if(LQS.i>=LQS.qs.length) lvFinish(); rerender(); break;
    case 'lvreset': LQS={cat:null,i:0,score:0,pick:null,qs:[],done:false}; rerender(); break;
    case 'counsel': { const m=$('#cmsg'); if(m) m.textContent='申し込み先を準備中です。セブ島留学バディーのサイトからご相談ください。'; break; }
    case 'askdemo': if(askLeft()<=0){ toast(`今日聞ける回数（${LIMIT[tier()].ask}回）を使い切りました。${tier()==='counseled'?'成約すると1日'+LIMIT.customer.ask+'回まで使えます。':''}`); break; } useAsk(); ASK={q:d.q,a:AI_DEMO[d.q],fb:null}; rerender(); break;
    case 'askvault': if(ASK.a&&!ASK.a.none){ addVault(ASK.a.en,ASK.a.ja,'AIに聞いた','ai'); rerender(); } break;
    case 'askmemo': if(addVault('',ASK.q,'メモ','ai')){ ASK={q:'',a:null,fb:null}; go('vault'); } break;
    case 'askfb': ASK.fb=d.v; rerender(); break;
    case 'vf': VF=d.f; rerender(); break;
    case 'vused': { const v=S.vault.find(x=>String(x.id)===d.id); if(v){ v.used=(v.used||0)+1; save(); rerender(); } break; }
    case 'vknow': { const v=S.vault.find(x=>String(x.id)===d.id); if(v){ Object.assign(v,review(v,d.ok==='1')); save(); rerender(); } break; }
    case 'vdel': S.vault=S.vault.filter(x=>String(x.id)!==d.id); save(); rerender(); break;
    case 'vask': { const v=S.vault.find(x=>String(x.id)===d.id); ASK={q:v?`「${v.ja}」の別の言い方は？`:'',a:null,fb:null}; go('ask'); break; }
    case 'testfrom': T={setup:{src:d.src,lv:'all',dir:'ja2en'},qs:null,i:0,score:0,pick:null}; go('test'); break;
    case 'tstart': { const s=$('#t-src'); if(s){ T.setup={src:s.value,lv:$('#t-lv').value,dir:$('#t-dir').value}; } startTest(); if(T.qs) rerender(); break; }
    case 'tpick': tpick(+d.i); break;
    case 'tnext': T.i++; T.pick=null; rerender(); break;
    case 'treset': T.qs=null; rerender(); break;
    case 'talkstart': talkStart(d.id); break;
    case 'talkend': TALK={id:null,msgs:[],step:0,done:false}; go('talk'); break;
    case 'talkmic': { try{ const r=new SR(); r.lang='en-US'; b.classList.add('rec'); r.onresult=ev=>{ $('#talk-in').value=ev.results[0][0].transcript; }; r.onend=()=>b.classList.remove('rec'); r.start(); }catch(err){} break; }
    case 'rqstart': RQ={i:0,answers:[]}; rerender(); break;
    case 'cvcolor': cvData().color=d.c; save(); rerender(); break;
    case 'cvadd': { const r=cvData(), tpl={edu:{title:'',major:'',school:'',years:'',desc:''},exp:{role:'',length:'',company:'',place:'',years:'',desc:''},refs:{name:'',org:'',position:'',phone:'',email:''}}[d.l]; if(tpl) r[d.l].push(tpl); save(); rerender(); break; }
    case 'cvdel': cvData()[d.l].splice(+d.i,1); save(); rerender(); break;
    case 'cvphotodel': cvData().photo=''; save(); rerender(); break;
    case 'rprint': window.print(); break;
  }
});
document.addEventListener('submit', e=>{
  const f=e.target.closest('[data-form]'); if(!f) return; e.preventDefault();
  if(f.dataset.form==='ask'){ const q=$('#ask-q').value.trim(); if(!q) return; if(askLeft()<=0){ toast(`今日聞ける回数（${LIMIT[tier()].ask}回）を使い切りました。`); return; } useAsk(); ASK={q,a:AI_DEMO[q]||{none:true},fb:null}; rerender(); }
  if(f.dataset.form==='vadd'){ const en=$('#va-en').value.trim(), ja=$('#va-ja').value.trim(); if(!en||!ja){ alert('英語と意味を入れてください。'); return; } addVault(en,ja,$('#va-sc').value,'manual'); rerender(); }
  if(f.dataset.form==='talk'){ talkSend($('#talk-in').value); }
  if(f.dataset.form==='rq'){ const a=$('#rq-a').value.trim(); if(!a) return; RQ.answers.push(a); RQ.i++;
    if(RQ.i>=RQS.length){ cvData(); S.resume.about = "Friendly and hardworking person with experience in customer service. Trusted to train new staff and handle busy shifts. Looking for a café or hospitality role to grow my skills and English."; save(); }
    rerender(); }
});
document.addEventListener('change', e=>{
  if(e.target.dataset.rb){ cvData()[e.target.dataset.rb]=e.target.checked; save(); rerender(); return; }
  if(e.target.dataset.file){ const fl=e.target.files&&e.target.files[0]; if(!fl) return; const kind=e.target.dataset.file, r=cvData();
    cvImage(fl, kind==='photo'?480:1100, url=>{ const bak=JSON.stringify(r);
      if(kind==='photo') r.photo=url; else if(kind==='cert') r.certs[+e.target.dataset.i].img=url; else r.certs.push({img:url,cap:''});
      if(!cvSave()){ S.resume=JSON.parse(bak); } rerender(); }); return; }
  const c=e.target.dataset.change; if(!c) return; const v=e.target.value;
  if(c==='gch') R.gch=v; else if(c==='whscene') R.whScene=v; else if(c==='scene') R.scene=v; else return;
  R.sel=null; rerender(); });
document.addEventListener('input', e=>{ const nk=e.target.dataset.note; if(nk){ S.notes=S.notes||{}; const v=e.target.value; if(v.trim()) S.notes[nk]=v; else delete S.notes[nk]; save(); return; } const k=e.target.dataset.r; if(k){ cvData()[k]=e.target.value; save(); cvRefresh(); return; }
  const l=e.target.dataset.rl; if(l){ cvData()[l][+e.target.dataset.i][e.target.dataset.k]=e.target.value; save(); cvRefresh(); return; }
  const c=e.target.dataset.rc; if(c){ cvData()[c]=e.target.value; save(); cvRefresh(); return; } });

let SW=null;
function swEls(){ const w=document.querySelector('.swipe-wrap'); return w?{w,el:w.querySelector('.detail'),prev:w.querySelector('.sw-hint.prev'),next:w.querySelector('.sw-hint.next')}:null; }
function swPaint(){
  if(!SW) return; SW.raf=0; const E=SW.E, dx=SW.dx, toNext=dx<0, has=SW.has, W=SW.W;
  const d = has ? dx : Math.sign(dx)*W*0.18*(1-Math.exp(-Math.abs(dx)/(W*0.18)));
  E.el.style.transform=`translate3d(${d}px,0,0)`;
  const h=toNext?E.next:E.prev, o=toNext?E.prev:E.next;
  if(h) h.style.opacity = has ? String(Math.min(1,Math.abs(dx)/(W*0.22))) : '0';
  if(o) o.style.opacity='0';
}
function swReset(E){ if(!E||!E.el) return; const el=E.el;
  el.style.transition='transform .38s cubic-bezier(.16,1,.3,1)'; el.style.transform='';
  [E.prev,E.next].forEach(h=>{ if(h){ h.style.transition='opacity .2s'; h.style.opacity='0'; } });
  setTimeout(()=>{ el.style.transition=''; },400); }
document.addEventListener('touchstart', e=>{
  SW=null; if(R.v!=='learn'||!R.sel||e.touches.length>1) return;
  if(!e.target.closest('.swipe-wrap') || e.target.closest('textarea,input,.chips,audio')) return;
  const E=swEls(); if(!E||!E.el) return;
  E.w.classList.remove('nudge');
  const x=e.touches[0].clientX, t0=performance.now();
  SW={x,y:e.touches[0].clientY,dx:0,mode:null,E,W:E.w.offsetWidth||360,pts:[[x,t0]],raf:0};
}, {passive:true});
document.addEventListener('touchmove', e=>{
  if(!SW) return; const c=e.touches[0], dx=c.clientX-SW.x, dy=c.clientY-SW.y;
  if(!SW.mode){ if(Math.abs(dx)>6 && Math.abs(dx)>Math.abs(dy)) { SW.mode='h'; SW.x=c.clientX-Math.sign(dx)*1; SW.E.el.style.transition='none'; [SW.E.prev,SW.E.next].forEach(h=>{ if(h) h.style.transition='none'; }); } else if(Math.abs(dy)>8){ SW=null; return; } else return; }
  e.preventDefault();
  const E=SW.E; SW.dx=c.clientX-SW.x;
  SW.has = SW.dx<0 ? !!(E.next && !E.next.classList.contains('off')) : !!(E.prev && !E.prev.classList.contains('off'));
  const now=performance.now(); SW.pts.push([c.clientX,now]); while(SW.pts.length>2 && now-SW.pts[0][1]>100) SW.pts.shift();
  if(!SW.raf) SW.raf=requestAnimationFrame(swPaint);
}, {passive:false});
document.addEventListener('touchend', ()=>{
  if(!SW) return; const S2=SW; SW=null; if(S2.raf) cancelAnimationFrame(S2.raf); if(S2.mode!=='h') return;
  const E=S2.E, p=S2.pts, a=p[0], b=p[p.length-1], v=(b[1]-a[1])>0 ? (b[0]-a[0])/(b[1]-a[1]) : 0;
  const dir=S2.dx<0?1:-1, flick=Math.abs(v)>0.35 && Math.sign(v)===Math.sign(S2.dx);
  const go=S2.has && (Math.abs(S2.dx)>S2.W*0.28 || flick);
  if(!go){ swReset(E); return; }
  const W=S2.W, rest=W-Math.abs(S2.dx), ms=Math.round(Math.max(120,Math.min(240, rest/Math.max(Math.abs(v),1.2))));
  E.el.style.transition=`transform ${ms}ms cubic-bezier(.3,.6,.4,1), opacity ${ms}ms`;
  E.el.style.transform=`translate3d(${dir>0?-W:W}px,0,0)`; E.el.style.opacity='.3';
  setTimeout(()=>stepTo(dir), ms-10);
}, {passive:true});
document.addEventListener('touchcancel', ()=>{ if(SW){ if(SW.raf) cancelAnimationFrame(SW.raf); swReset(SW.E); SW=null; } }, {passive:true});
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea,select')) return;
  if(R.v==='learn' && R.sel && (e.key==='ArrowRight'||e.key==='ArrowLeft') && !document.querySelector('dialog[open]')){ if(stepTo(e.key==='ArrowRight'?1:-1)) e.preventDefault(); return; }
  const n=+e.key; if(!(n>=1&&n<=4)) return;
  if(R.v==='test' && T.qs && T.i<T.qs.length && T.pick===null && T.qs[T.i].opts[n-1]){ tpick(n-1); }
  else if(R.v==='level' && LQS.cat && !LQS.done && LQS.pick===null && LQS.qs[LQS.i] && LQS.qs[LQS.i].opts[n-1]){ document.querySelector(`[data-act=lvpick][data-i="${n-1}"]`).click(); }
});

render();
</script>
